<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C5CE7">
<title>语文闯关大冒险 · 一年级上册</title>
<style>
/* ===================== 基础 ===================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  background:#EDF1FA;color:#22314A;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#app{
  width:100%;max-width:460px;height:100%;max-height:940px;
  background:linear-gradient(170deg,#F7F9FF 0%,#EDF1FA 55%,#E8EEFB 100%);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 12px 60px rgba(70,90,160,.18);
}
@media(min-width:520px) and (min-height:800px){
  #app{border-radius:26px;}
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* ===================== 通用组件 ===================== */
.btn{
  border:none;border-radius:16px;font-family:inherit;font-weight:800;
  cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s;
  font-size:17px;padding:14px 22px;color:#fff;
  background:linear-gradient(180deg,#7C6BF0,#6350E0);
  box-shadow:0 4px 0 #4C3BC4,0 8px 18px rgba(99,80,224,.35);
  letter-spacing:.5px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4C3BC4,0 4px 10px rgba(99,80,224,.3);}
.btn.green{background:linear-gradient(180deg,#4ED08B,#2FB86E);box-shadow:0 4px 0 #21A05C,0 8px 18px rgba(47,184,110,.32);}
.btn.orange{background:linear-gradient(180deg,#FFB347,#FF9524);box-shadow:0 4px 0 #E07C10,0 8px 18px rgba(255,149,36,.32);}
.btn.red{background:linear-gradient(180deg,#FF7A7A,#F05252);box-shadow:0 4px 0 #CE3A3A,0 8px 18px rgba(240,82,82,.3);}
.btn.gray{background:linear-gradient(180deg,#B9C3D6,#9AA6BF);box-shadow:0 4px 0 #7E8AA3;}
.btn.sm{font-size:15px;padding:10px 18px;border-radius:13px;}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.85);border-radius:999px;
  padding:6px 13px;font-size:14px;font-weight:800;color:#3A4A68;
  box-shadow:0 2px 8px rgba(80,100,160,.13);
}
.card{
  background:#fff;border-radius:20px;padding:16px;
  box-shadow:0 4px 20px rgba(80,100,160,.13);
}

/* ===================== 首页 ===================== */
#home{padding:0;overflow-y:auto;}
.home-bg{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.bubble{position:absolute;border-radius:50%;opacity:.5;}
.hb1{width:190px;height:190px;background:radial-gradient(circle at 30% 30%,#C9D8FF,#EAF0FF);top:-60px;left:-50px;}
.hb2{width:150px;height:150px;background:radial-gradient(circle at 30% 30%,#FFE1C4,#FFF3E6);top:120px;right:-55px;}
.hb3{width:120px;height:120px;background:radial-gradient(circle at 30% 30%,#D3F5E4,#EDFBF4);bottom:210px;left:-40px;}
.hb4{width:170px;height:170px;background:radial-gradient(circle at 30% 30%,#EDDCFF,#F7F1FF);bottom:-50px;right:-45px;}
.home-inner{position:relative;z-index:1;padding:26px 20px 26px;display:flex;flex-direction:column;gap:15px;min-height:100%;}
.logo-emoji{font-size:54px;text-align:center;animation:float 3s ease-in-out infinite;line-height:1;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.title-main{
  text-align:center;font-size:29px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(95deg,#6C5CE7,#3FB8AF 55%,#FF9524);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.25;
}
.title-sub{text-align:center;font-size:13.5px;color:#6B7A99;font-weight:700;letter-spacing:.6px;margin-top:4px;}
.stat-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.timer-box{
  background:#fff;border-radius:22px;padding:14px 16px;
  box-shadow:0 4px 20px rgba(80,100,160,.14);
}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.timer-label{font-size:13.5px;font-weight:800;color:#6B7A99;}
.timer-val{font-size:15px;font-weight:900;color:#6C5CE7;font-variant-numeric:tabular-nums;}
.bar{height:12px;background:#EDF0F8;border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7C6BF0,#4ED08B);transition:width .4s;width:0;}
.avatar-row{display:flex;align-items:center;gap:12px;}
.avatar{
  width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#FFF0D6,#FFE0B0);
  display:flex;align-items:center;justify-content:center;font-size:31px;flex:0 0 auto;
  box-shadow:0 3px 12px rgba(200,150,60,.25);
}
.avatar-info{flex:1;min-width:0;}
.avatar-title{font-size:16px;font-weight:900;color:#2C3B57;display:flex;align-items:center;gap:5px;}
.avatar-desc{font-size:12px;color:#8391AB;font-weight:700;margin-top:3px;}

/* ===================== 地图页 ===================== */
#map{overflow:hidden;}
.topbar{
  flex:0 0 auto;padding:12px 14px 10px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(9px);
  border-bottom:1px solid rgba(140,160,210,.16);z-index:5;
}
.topbar .t-title{flex:1;font-size:16.5px;font-weight:900;color:#2C3B57;}
.icon-btn{
  width:37px;height:37px;border-radius:12px;border:none;background:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 9px rgba(80,100,160,.15);cursor:pointer;flex:0 0 auto;
}
.icon-btn:active{transform:scale(.94);}
.map-scroll{flex:1;overflow-y:auto;padding:16px 14px 90px;-webkit-overflow-scrolling:touch;}
.unit{
  background:#fff;border-radius:22px;padding:14px;margin-bottom:14px;
  box-shadow:0 4px 18px rgba(80,100,160,.11);position:relative;overflow:hidden;
}
.unit::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc,#6C5CE7);
}
.unit-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.unit-icon{
  width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:25px;flex:0 0 auto;background:var(--uct,#EDF0FB);
}
.unit-meta{flex:1;min-width:0;}
.unit-name{font-size:16px;font-weight:900;color:#2C3B57;}
.unit-prog{font-size:11.5px;color:#8895AE;font-weight:800;margin-top:3px;}
.unit-progbar{height:6px;background:#EDF0F8;border-radius:99px;overflow:hidden;margin-top:6px;}
.unit-progbar i{display:block;height:100%;background:var(--uc,#6C5CE7);border-radius:99px;transition:width .4s;width:0;}
.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.sub{
  display:flex;align-items:center;gap:8px;padding:11px 11px;
  border-radius:15px;background:#F6F8FE;border:2px solid transparent;
  cursor:pointer;transition:transform .12s,background .15s;
  position:relative;overflow:hidden;
}
.sub:active{transform:scale(.97);}
.sub .sn{
  width:25px;height:25px;border-radius:9px;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:900;color:#7C8BA6;box-shadow:0 1px 4px rgba(80,100,160,.14);
}
.sub .st{font-size:12.5px;font-weight:800;color:#3F4E6B;line-height:1.3;flex:1;min-width:0;}
.sub.done{background:#EAF9F1;}
.sub.done .sn{background:#2FB86E;color:#fff;}
.sub.locked{opacity:.5;}
.sub.locked .sn{background:#DFE4EF;color:#98A5BC;}
.sub .star-mini{font-size:10px;color:#FFB800;position:absolute;right:6px;top:5px;letter-spacing:-1px;}
.chest-row{
  display:flex;align-items:center;gap:11px;padding:12px 14px;margin-top:11px;
  border-radius:16px;background:linear-gradient(100deg,#FFF7E4,#FFEFD2);
  border:2px dashed #F0C97A;
}
.chest-row.ready{background:linear-gradient(100deg,#FFF0CE,#FFE2A6);border-color:#E8A93B;animation:pulseChest 1.6s infinite;}
@keyframes pulseChest{0%,100%{box-shadow:0 0 0 0 rgba(232,169,59,.4)}50%{box-shadow:0 0 0 9px rgba(232,169,59,0)}}
.chest-emoji{font-size:28px;}
.chest-txt{flex:1;font-size:12.5px;font-weight:800;color:#8A6218;line-height:1.4;}

/* ===================== 底部导航 ===================== */
.tabbar{
  flex:0 0 auto;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-top:1px solid rgba(140,160,210,.16);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:6;
}
.tab{
  flex:1;border:none;background:none;padding:6px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;color:#9AA6BF;font-weight:800;font-size:10.5px;
}
.tab .ti{font-size:20px;line-height:1;}
.tab.on{color:#6C5CE7;}

/* ===================== 答题页 ===================== */
#play{background:#F4F7FD;}
.play-top{
  flex:0 0 auto;padding:11px 14px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(9px);
  border-bottom:1px solid rgba(140,160,210,.16);
}
.play-top .pt-title{flex:1;font-size:14.5px;font-weight:900;color:#2C3B57;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qbar{height:8px;background:#E6EAF5;border-radius:99px;overflow:hidden;margin:0 14px;}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#FFB347,#FF9524);border-radius:99px;transition:width .35s;width:0;}
.hud{display:flex;gap:7px;justify-content:center;padding:11px 14px 0;flex-wrap:wrap;}
.play-body{flex:1;overflow-y:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch;}
.qtext{
  font-size:19px;font-weight:900;color:#25344F;line-height:1.55;margin-bottom:16px;
  letter-spacing:.3px;
}
.qtext .hl{color:#6C5CE7;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:15px 15px;border-radius:17px;
  background:#fff;border:2.5px solid #E6EAF5;cursor:pointer;
  font-size:16.5px;font-weight:800;color:#2C3B57;line-height:1.42;text-align:left;
  font-family:inherit;transition:transform .12s,border-color .15s,background .15s;
  box-shadow:0 2px 9px rgba(80,100,160,.08);width:100%;
}
.opt:active{transform:scale(.98);}
.opt .badge{
  width:31px;height:31px;border-radius:11px;background:#F1F4FC;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:900;color:#7C8BA6;
}
.opt.right{background:#E9FBF1;border-color:#2FB86E;}
.opt.right .badge{background:#2FB86E;color:#fff;}
.opt.wrong{background:#FEEEEC;border-color:#F05252;animation:shake .4s;}
.opt.wrong .badge{background:#F05252;color:#fff;}
.opt.dim{opacity:.42;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.big{font-size:24px;justify-content:center;}

/* 拼音卡 */
.pinyin-card{
  background:#fff;border-radius:22px;padding:22px 16px;text-align:center;
  box-shadow:0 4px 20px rgba(80,100,160,.13);margin-bottom:16px;
}
.py-line{font-size:52px;font-weight:900;color:#6C5CE7;letter-spacing:3px;line-height:1.25;}
.py-line .py-sp{color:#3FB8AF;}
.py-hint{font-size:14px;color:#8895AE;font-weight:800;margin-top:9px;}

/* 大字卡 */
.bigchar{
  background:linear-gradient(150deg,#FFF9EE,#FFF3DE);border-radius:22px;
  padding:26px 16px;text-align:center;margin-bottom:16px;
  border:2.5px solid #F5E2BE;
}
.bigchar .bc-char{font-size:74px;font-weight:900;color:#B8791B;line-height:1.1;}
.bigchar .bc-py{font-size:19px;font-weight:800;color:#C9973F;margin-top:8px;letter-spacing:1px;}
.bigchar .bc-tip{font-size:12.5px;font-weight:700;color:#A98653;margin-top:8px;}

/* 田字格 */
.tian{
  width:150px;height:150px;margin:0 auto 14px;position:relative;
  background:#fff;border:3px solid #E4B96A;border-radius:12px;
}
.tian::before,.tian::after{content:'';position:absolute;background:repeating-linear-gradient(to right,#F0C97A 0 6px,transparent 6px 12px);}
.tian::before{left:0;right:0;top:50%;height:2px;transform:translateY(-1px);}
.tian::after{top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:repeating-linear-gradient(to bottom,#F0C97A 0 6px,transparent 6px 12px);}
.tian .ch{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:100px;font-weight:900;color:#2C3B57;line-height:1;
}

/* 排序题 */
.order-area{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.order-slot{
  min-height:56px;border-radius:16px;border:2.5px dashed #C9D3E8;background:#FAFBFF;
  display:flex;align-items:center;gap:7px;padding:8px 11px;flex-wrap:wrap;
}
.order-slot.filled{border-style:solid;border-color:#B9C3D6;}
.chip{
  padding:11px 15px;border-radius:14px;background:linear-gradient(180deg,#8B7BF5,#6C5CE7);
  color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;border:none;font-family:inherit;
  box-shadow:0 3px 0 #4C3BC4;transition:transform .12s;
}
.chip:active{transform:translateY(2px);}
.chip.sel{background:linear-gradient(180deg,#5FD9A6,#2FB86E);box-shadow:0 3px 0 #21A05C;}
.chip.pool{background:linear-gradient(180deg,#AEB9CE,#93A0B9);box-shadow:0 3px 0 #7A879F;}
.order-pool{display:flex;gap:9px;flex-wrap:wrap;padding:12px;border-radius:16px;background:#fff;min-height:64px;
  box-shadow:0 2px 10px rgba(80,100,160,.09);}

/* 分类题 */
.cats{display:flex;flex-direction:column;gap:11px;margin-bottom:13px;}
.cat{
  background:#fff;border-radius:17px;padding:12px;box-shadow:0 2px 11px rgba(80,100,160,.09);
  border:2.5px solid transparent;transition:border-color .15s,background .15s;
}
.cat.hot{border-color:#6C5CE7;background:#F5F3FF;}
.cat-title{font-size:13.5px;font-weight:900;color:#5A6A88;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.cat-title .dot{width:9px;height:9px;border-radius:50%;background:#6C5CE7;flex:0 0 auto;}
.cat-items{display:flex;gap:7px;flex-wrap:wrap;min-height:42px;align-content:flex-start;}
.pool-wrap{background:#F6F8FE;border-radius:17px;padding:12px;border:2px dashed #C9D3E8;}
.pool-title{font-size:12.5px;font-weight:900;color:#8895AE;margin-bottom:9px;}
.pool-items{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;}

/* 反馈浮层 */
.fb{
  position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  border-radius:20px;padding:15px 16px;z-index:30;
  box-shadow:0 -4px 30px rgba(60,80,140,.2);
  transform:translateY(160%);transition:transform .32s cubic-bezier(.2,1.1,.4,1);
}
.fb.show{transform:translateY(0);}
.fb.ok{background:linear-gradient(180deg,#EAFBF2,#DBF7E9);border:2.5px solid #7ED9A9;}
.fb.no{background:linear-gradient(180deg,#FFF0EE,#FFE2DF);border:2.5px solid #F5A9A2;}
.fb-head{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:8px;}
.fb.ok .fb-head{color:#1E9A5C;}
.fb.no .fb-head{color:#D63C3C;}
.fb-tip{font-size:14px;font-weight:700;color:#4A5A78;line-height:1.5;margin-bottom:12px;}
.fb-tip b{color:#2C3B57;}
.fb-row{display:flex;gap:9px;}

/* 结算页 */
#result{background:linear-gradient(170deg,#FFF8EA,#EFF3FC);}
.res-inner{flex:1;overflow-y:auto;padding:22px 18px 20px;text-align:center;}
.res-star{font-size:60px;line-height:1;animation:pop .55s cubic-bezier(.2,1.6,.5,1);}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.res-title{font-size:25px;font-weight:900;margin-top:10px;color:#2C3B57;}
.res-sub{font-size:14px;color:#7C8BA6;font-weight:800;margin-top:6px;}
.res-card{background:#fff;border-radius:20px;padding:15px;margin-top:16px;box-shadow:0 4px 18px rgba(80,100,160,.12);}
.res-line{display:flex;justify-content:space-between;font-size:14.5px;font-weight:800;color:#4A5A78;padding:7px 2px;}
.res-line b{color:#6C5CE7;font-size:16px;}
.res-line.err b{color:#F05252;}
.wrong-list{margin-top:14px;text-align:left;}
.wrong-item{
  background:#FFF7F6;border-left:4px solid #F5A9A2;border-radius:11px;
  padding:11px 12px;margin-bottom:9px;
}
.wrong-item .wq{font-size:13.5px;font-weight:900;color:#3F4E6B;line-height:1.45;}
.wrong-item .wa{font-size:12.5px;font-weight:700;color:#D63C3C;margin-top:5px;line-height:1.45;}

/* ===================== 弹窗 ===================== */
.modal{
  position:absolute;inset:0;background:rgba(30,42,70,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:60;
}
.modal.show{display:flex;}
.modal-box{
  background:#fff;border-radius:24px;padding:22px 18px;width:100%;max-height:82%;overflow-y:auto;
  box-shadow:0 16px 50px rgba(30,42,70,.3);animation:pop .35s cubic-bezier(.2,1.4,.5,1);
}
.modal-title{font-size:19px;font-weight:900;text-align:center;color:#2C3B57;margin-bottom:14px;}
.modal-actions{display:flex;gap:9px;margin-top:16px;}
.modal-actions .btn{flex:1;}

/* 知识卡 */
.kc-lessons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;}
.kc-lesson{
  font-size:11.5px;font-weight:800;color:#6C5CE7;background:#F1EEFF;
  border-radius:9px;padding:5px 9px;
}
.kc-point{
  font-size:13.5px;font-weight:700;color:#3F4E6B;line-height:1.62;
  padding:10px 12px;background:#F7F9FE;border-radius:13px;margin-bottom:8px;
  border-left:4px solid #A99BF5;
}
.kc-poem{
  background:linear-gradient(150deg,#FFF9EE,#FFF3DE);border-radius:15px;padding:13px 14px;margin-bottom:9px;
  border:2px solid #F5E2BE;
}
.kc-poem .kp-t{font-size:15px;font-weight:900;color:#B8791B;}
.kc-poem .kp-a{font-size:11.5px;font-weight:800;color:#C9973F;margin:3px 0 7px;}
.kc-poem .kp-c{font-size:14px;font-weight:700;color:#7A5A22;line-height:1.7;}

/* 勋章墙 */
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:6px;}
.badge-it{
  background:#F7F9FE;border-radius:16px;padding:12px 6px;text-align:center;
}
.badge-it.on{background:linear-gradient(160deg,#FFF4DC,#FFE9BE);box-shadow:0 2px 10px rgba(220,170,60,.2);}
.badge-it .bi-e{font-size:27px;line-height:1;filter:grayscale(1);opacity:.35;}
.badge-it.on .bi-e{filter:none;opacity:1;}
.badge-it .bi-n{font-size:10.5px;font-weight:900;color:#8895AE;margin-top:6px;line-height:1.25;}
.badge-it.on .bi-n{color:#8A6218;}

/* 宝箱动画 */
.chest-modal{background:rgba(30,42,70,.62);}
.chest-open{text-align:center;padding:8px 0 4px;}
.chest-big{font-size:82px;display:inline-block;animation:chestShake .55s ease-in-out infinite;}
@keyframes chestShake{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.09)}}
.chest-reward{
  margin-top:16px;background:linear-gradient(160deg,#FFF6E0,#FFEABC);
  border-radius:18px;padding:17px;border:2.5px solid #F0C97A;
}
.chest-reward .cr-e{font-size:46px;line-height:1;}
.chest-reward .cr-n{font-size:18px;font-weight:900;color:#8A6218;margin-top:8px;}
.chest-reward .cr-d{font-size:12.5px;font-weight:700;color:#A98653;margin-top:6px;line-height:1.5;}

/* 时间到 */
.timeup-emoji{font-size:66px;text-align:center;line-height:1;}

  ],

    bar(['C3',4]), bar(['F2',2],['G2',2]), bar(['A2',4]), bar(['C3',4])
  ]

/* 结算专属：通关小胜利 */
M.win = {
  bpm: 132, wave:'sine', bassWave:'triangle', leadVol:.11, bassVol:.075,
  lead:[
    bar(['C5',.5],['E5',.5],['G5',1],['C6',2]),
    bar(['B5',.5],['A5',.5],['G5',1],['E5',2]),
    bar(['F5',.5],['G5',.5],['A5',1],['G5',2]),

  ],

/* 失败专属：温柔安慰，不打击 */
M.lose = {
  bpm: 84, wave:'sine', bassWave:'sine', leadVol:.095, bassVol:.07,

    bar(['E5',2],['D5',2]),

  ],
  bass:[
    bar(['A2',4]), bar(['F2',4]), bar(['G2',4]), bar(['C3',4])
  ]

/* ------------------------- 调度器 ------------------------- */
let ctx=null;
let master=null, musicGain=null, duckGain=null;
let curId=null, playing=false;
let timer=null;              // 循环调度定时器
let nextTime=0;              // 下一个音符的绝对时间
let step=0;                  // 已排到第几个十六分音位
let track=null;              // 当前曲目
let ducked=false;            // 是否处于压低音量状态

function ensureCtx(){
  if(!ctx){
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){ return null; }
    master = ctx.createGain(); master.gain.value = 1;
    duckGain = ctx.createGain(); duckGain.gain.value = 1;
    musicGain = ctx.createGain(); musicGain.gain.value = 0;
    musicGain.connect(duckGain); duckGain.connect(master); master.connect(ctx.destination);
  }
  if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
  return ctx;
}
/* 主开关：以主程序暴露的 S 为准；S 尚未就绪时（极早期）默认允许，
   由主程序自己在调用前用 musicEnabled() 把关，避免两边判断不一致 */
function enabled(){
  const st = window.S;
  if(!st) return true;
  if(st.sound===false) return false;
  if(st.music===false) return false;
  return true;
}

/* 把一首曲子的 lead/bass 展开成「时间轴事件表」
   返回 [{t:拍偏移, dur:拍长, f:频率, v:音量, w:波形}] */
function flatten(t){
  const ev=[];
  const beat = 60/t.bpm;
  // lead
  let pos=0;
  t.lead.forEach(barNotes=>{
    let bp=0;
    barNotes.forEach(n=>{
      const [nm,len]=n;
      if(nm!=='-'){
        const oct = parseInt(nm.slice(-1),10);
        const pit = nm.slice(0,-1);
        ev.push({t:(pos+bp)*beat, dur:len*beat*.94, f:freq(pit,oct),
                 v:t.leadVol, w:t.wave, lead:true});
      }
      bp+=len;
    });
    pos += 4;                 // 每小节固定 4 拍
  });
  const leadBeats = pos;

  // bass（长度以 lead 总长为准循环补齐）
  let bpos=0;
  t.bass.forEach(barNotes=>{
    barNotes.forEach(n=>{
      const [nm,len]=n;
      if(nm!=='-'){
        const oct=parseInt(nm.slice(-1),10);
        const pit=nm.slice(0,-1);
        ev.push({t:bpos*beat, dur:len*beat*.96, f:freq(pit,oct),
                 v:t.bassVol, w:t.bassWave, lead:false});
      }
      bpos+=len;
    });
    bpos = Math.round(bpos/4)*4;   // 对齐到小节
  });
  const totalBeats = Math.max(leadBeats, Math.round(bpos/4)*4) || 4;
  ev.sort((a,b)=>a.t-b.t);
  return {ev, total: totalBeats*beat, beat};
}

/* 安排一个音符 */
function schedule(e, at){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=e.w; o.frequency.value=e.f;
  // 轻微颤音让音色更柔（三角/正弦加一点点）
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(e.v, at + Math.min(.05, e.dur*.25));
  g.gain.exponentialRampToValueAtTime(0.0001, at + e.dur);
  o.connect(g); g.connect(musicGain);
  o.start(at); o.stop(at + e.dur + .06);
}

/* 主循环：以「循环起点时间」为单位推进，每个循环一次性排完整首。
   提前 1.2 秒准备下一轮，避免 setTimeout 抖动造成断音。 */
function loopSchedule(){
  if(!playing||!ctx||!track) return;
  const now = ctx.currentTime;
  if(track.nextStart === 0) track.nextStart = now + .08;
  // 提前 1.2 秒准备下一个循环
  while(track.nextStart - now < 1.2){
    const start = track.nextStart;
    track.ev.forEach(e=>{
      if(start + e.t >= now) schedule(e, start + e.t);
    });
    // 末尾留 0.5 拍呼吸，接下一个循环
    track.nextStart = start + track.total;
  }
}

function start(id){
  if(!enabled()) return;
  const c=ensureCtx(); if(!c) return;
  const t=M[id]; if(!t) return;
  if(curId===id && playing) return;
  stop(true);
  const flat=flatten(t);
  track=Object.assign({},flat,{nextStart:0});
  curId=id; playing=true;
  // 淡入
  musicGain.gain.cancelScheduledValues(c.currentTime);
  musicGain.gain.setValueAtTime(0.0001, c.currentTime);
  musicGain.gain.linearRampToValueAtTime(1, c.currentTime + .9);
  loopSchedule();
  if(timer) clearInterval(timer);
  timer=setInterval(loopSchedule, 300);
}

function stop(keepId){
  playing=false;
  if(timer){ clearInterval(timer); timer=null; }
  if(ctx&&musicGain){
    const c=ctx;
    musicGain.gain.cancelScheduledValues(c.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, c.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.0001, c.currentTime + .25);
  }
  track=null;
  if(!keepId) curId=null;
}

/* 压低 / 恢复音乐（答对、开宝箱时短暂让位给音效） */
function duck(on, holdMs){
  if(!ctx||!duckGain) return;
  const c=ctx, target = on?0.42:1;
  duckGain.gain.cancelScheduledValues(c.currentTime);
  duckGain.gain.setValueAtTime(duckGain.gain.value, c.currentTime);
  duckGain.gain.linearRampToValueAtTime(target, c.currentTime + (on?.18:.45));
  ducked=on;
  if(on && holdMs){
    setTimeout(()=>{ if(ducked) duck(false); }, holdMs);
  }
}

/* 音量总开关 */
function setVolume(v){
  if(!ctx||!master) return;
  const c=ctx;
  master.gain.cancelScheduledValues(c.currentTime);
  master.gain.setValueAtTime(master.gain.value, c.currentTime);
  master.gain.linearRampToValueAtTime(Math.max(0,Math.min(1,v)), c.currentTime+.2);
}

/* 用户手势后解锁音频 */
function unlock(){
  const c=ensureCtx();
  if(!c) return;
  if(ctx.state==='suspended') ctx.resume();
  // 如果当前应该在播但没播起来，补上
  if(enabled() && !playing && curId) start(curId);
}

/* ------------------------- 对外接口 ------------------------- */
window.MUSIC = {
  start, stop, duck, setVolume, unlock,
  current: ()=>curId,
  isPlaying: ()=>playing,
  ids: Object.keys(M)
};
})();

function isUnlocked(unitId, idx){

  if(bestStars(unitId, idx)>0) return true;          // 已通关（可重玩刷星）

/* ------------------------- 答题流程 ------------------------- */
let Q={ list:[], idx:0, unit:null, sub:null, levelIdx:0, subIdx:0,
        hps:3, combo:0, maxCombo:0, rightN:0, stars:0, wrongs:[], answered:false, tStart:0, locked:false };

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildQuestionList(lv, sb, si){
  const key = lv.id+'_'+si;
  let pool = QUESTIONS[key] || [];
  if(!pool.length){
    // 兜底：从本单元其它小关抽题
    for(const k in QUESTIONS){
      if(k.indexOf(lv.id+'_')===0) pool=pool.concat(QUESTIONS[k]);
    }
  }
  if(!pool.length) pool = QUESTIONS.u1_0;
  // 打乱选项顺序
  const list = shuffle(pool).slice(0,10).map(q=>{
    const nq = JSON.parse(JSON.stringify(q));
    if(nq.opts && nq.opts.length){
      nq._correct = nq.opts[nq.a];
      const sh = shuffle(nq.opts);
      nq.opts = sh;
      nq.a = sh.indexOf(nq._correct);
      // 如果选项看起来是拼音/固定顺序，保留干扰项
    }
    return nq;
  });
  return list;
}

function startLevel(li,si){
  const lv=LEVELS[li], sb=lv.subs[si];
  Q = { list:buildQuestionList(lv,sb,si), idx:0, unit:lv, sub:sb, levelIdx:li, subIdx:si,
        hps:3, combo:0, maxCombo:0, rightN:0, stars:0, wrongs:[], answered:false, tStart:Date.now(), locked:false };
  $('playTitle').textContent = lv.emoji+' '+sb.name;
  show('play');
  if(!tickTimer) { sessionStart=Date.now(); startTick(); }
  renderQuestion();
  bgm(lv.id);          // 每个单元一首专属 BGM
}

function renderQuestion(){
  const q=Q.list[Q.idx];
  Q.answered=false;
  $('qIdx').textContent=Q.idx+1;
  $('qTotal').textContent=Q.list.length;
  $('hpHud').textContent=Q.hps;
  $('comboHud').textContent=Q.combo;
  $('starHud').textContent=Q.stars;
  $('qbarFill').style.width=(Q.idx/Q.list.length*100)+'%';
  hideFb();
  const b=$('playBody'); b.scrollTop=0;

  const t=q.t||'quiz';
  let h='';
  if(t==='blend' && q.parts){
    h+='<div class="pinyin-card"><div class="py-line">'+q.parts.map(p=>'<span class="py-sp">'+esc(p)+'</span>').join('<span style="color:#C9D3E8"> - </span>')+'</div>'
      +'<div class="py-hint">拼一拼，读出来，再选正确的音节</div></div>';
  }
  if(t==='piggy'){
    const ch=q.q.match(/“(.+?)”/);
    h+='<div class="bigchar"><div class="bc-char">'+(ch?esc(ch[1]):'?')+'</div>'
      +(ch?'<div class="bc-py">加上笔画 / 偏旁，看看能变成什么字</div>':'')+'</div>';
  }
  if(t==='recite'||t==='fill'){
    h+='<div class="bigchar" style="padding:20px 14px;background:linear-gradient(150deg,#F1EEFF,#E8E3FF);border-color:#D6CEFF;">'
      +'<div style="font-size:15px;font-weight:900;color:#5A48D6;line-height:1.6;">📜 背诵接龙</div></div>';
  }
  h+='<div class="qtext">'+esc(q.q)+'</div>';

  if(t==='order'){
    h+='<div class="order-slot filled" id="slot"></div>'
     +'<div class="pool-wrap" style="margin-top:0"><div class="pool-title">👇 按正确顺序点下面的词语</div>'
     +'<div class="order-pool" id="pool"></div></div>'
     +'<div style="display:flex;gap:9px;margin-top:14px;">'
     +'<button class="btn sm gray" style="flex:1" onclick="orderReset()">🔄 重来</button>'
     +'<button class="btn sm green" style="flex:1" onclick="orderSubmit()">✅ 确认</button></div>';
    b.innerHTML=h;
    Q.orderPick=[];
    renderOrderPool(q);
    return;
  }
  if(t==='group'){
    h+='<div class="cats" id="cats"></div>';
    h+='<div class="pool-wrap"><div class="pool-title">👇 点一下词语，再点上面的分类框</div><div class="pool-items" id="gpool"></div></div>';
    h+='<div style="display:flex;gap:9px;margin-top:14px;">'
     +'<button class="btn sm gray" style="flex:1" onclick="groupReset()">🔄 重来</button>'
     +'<button class="btn sm green" style="flex:1" onclick="groupSubmit()">✅ 确认</button></div>';
    b.innerHTML=h;
    Q.groupState={};   // item -> catName
    Q.groupSel=null;
    renderGroup(q);
    return;
  }
  // 选择类
  let cols='opts';
  const isBig = q.opts.every(o=>o.length<=3);
  h+='<div class="'+cols+'" id="opts"></div>';
  b.innerHTML=h;
  const ob=$('opts');
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt'+(isBig?' big':'');
    btn.innerHTML=(isBig?'':'<span class="badge">'+'ABCD'[i]+'</span>')+'<span>'+esc(o)+'</span>';
    btn.onclick=()=>answerChoice(i,btn);
    ob.appendChild(btn);
  });
}

/* ---- 排序题 ---- */
function renderOrderPool(q){
  const pool=$('pool'); pool.innerHTML='';
  const slot=$('slot');
  slot.innerHTML = (Q.orderPick||[]).map((w,i)=>'<button class="chip sel" onclick="orderRemove('+i+')">'+esc(w)+'</button>').join('');
  q.items.forEach((w,i)=>{
    const used=(Q.orderPick||[]).filter(x=>x===w).length;
    const total=q.items.filter(x=>x===w).length;
    const left=total-used;
    for(let k=0;k<left;k++){
      const b=document.createElement('button');
      b.className='chip pool';
      b.textContent=w;
      b.onclick=()=>{ Q.orderPick.push(w); SFX.tap(); renderOrderPool(q); };
      pool.appendChild(b);
    }
  });
}
function orderRemove(i){ const q=Q.list[Q.idx]; Q.orderPick.splice(i,1); SFX.tap(); renderOrderPool(q); }
function orderReset(){ Q.orderPick=[]; SFX.tap(); renderOrderPool(Q.list[Q.idx]); }
function orderSubmit(){
  const q=Q.list[Q.idx];
  const right = Q.orderPick.length===q.items.length && Q.orderPick.join('|')===q.items.join('|');
  Q.answerText = Q.orderPick.join(' ') || '(空)';
  Q.rightText = q.items.join(' ');
  handleResult(right, q.tip);
}

/* ---- 分类题 ---- */
function renderGroup(q){
  const cats=$('cats'); cats.innerHTML='';
  Object.keys(q.cats).forEach(cn=>{
    const d=document.createElement('div');
    d.className='cat'+(Q.groupSel===cn?' hot':'');
    d.onclick=()=>{ if(Q.groupSel){ assignToCat(Q.groupSel,cn); } };
    const items=Object.keys(Q.groupState).filter(k=>Q.groupState[k]===cn);
    d.innerHTML='<div class="cat-title"><span class="dot"></span>'+esc(cn)+'　<b style="color:#B9C3D6">'+items.length+'</b></div>'
      +'<div class="cat-items">'+items.map(it=>'<button class="chip sel" onclick="unassignCat(\''+esc(it).replace(/'/g,"\\'")+'\')">'+esc(it)+'</button>').join('')+'</div>';
    cats.appendChild(d);
  });
  const pool=$('gpool'); pool.innerHTML='';
  const left=q.pool.filter(it=>!Q.groupState[it]);
  if(!left.length){ pool.innerHTML='<div style="font-size:12.5px;color:#98A5BC;font-weight:800;">全部分好啦，点「确认」检查 👍</div>'; }
  left.forEach(it=>{
    const b=document.createElement('button');
    b.className='chip pool';
    b.textContent=it;
    b.onclick=()=>{ Q.groupSel=it; SFX.tap(); renderGroup(q); };
    if(Q.groupSel===it){ b.className='chip'; }
    pool.appendChild(b);
  });
}
function assignToCat(item,cat){ Q.groupState[item]=cat; Q.groupSel=null; SFX.tap(); renderGroup(Q.list[Q.idx]); }
function unassignCat(item){ delete Q.groupState[item]; SFX.tap(); renderGroup(Q.list[Q.idx]); }
function groupReset(){ Q.groupState={}; Q.groupSel=null; SFX.tap(); renderGroup(Q.list[Q.idx]); }
function groupSubmit(){
  const q=Q.list[Q.idx];
  const items=q.pool;
  if(items.some(it=>!Q.groupState[it])){ toast('还有词语没有分类哦～'); SFX.wrong(); return; }
  let ok=true, wrongItems=[];
  items.forEach(it=>{
    const should = Object.keys(q.cats).find(cn=>q.cats[cn].indexOf(it)>=0);
    if(Q.groupState[it]!==should){ ok=false; wrongItems.push(it); }
  });
  Q.answerText = items.map(it=>it+'→'+(Q.groupState[it]||'未分类')).join('，');
  Q.rightText = items.map(it=>{ const s=Object.keys(q.cats).find(cn=>q.cats[cn].indexOf(it)>=0); return it+'→'+s; }).join('，');
  handleResult(ok, q.tip);
  if(!ok){ // 标出错误项
    setTimeout(()=>{
      document.querySelectorAll('.cat-items .chip').forEach(el=>{
        if(wrongItems.indexOf(el.textContent)>=0){ el.style.background='linear-gradient(180deg,#FF7A7A,#F05252)'; el.style.boxShadow='0 3px 0 #CE3A3A'; }
      });
    },60);
  }
}

/* ---- 选择题 ---- */
function answerChoice(i,btn){
  if(Q.answered) return;
  const q=Q.list[Q.idx];
  Q.answerText=q.opts[i];
  Q.rightText=q._correct||q.opts[q.a];
  const ok=i===q.a;
  if(ok){ btn.classList.add('right'); }
  else{
    btn.classList.add('wrong');
    const all=document.querySelectorAll('#opts .opt');
    if(all[q.a]) all[q.a].classList.add('right');
    all.forEach((el,k)=>{ if(k!==i && k!==q.a) el.classList.add('dim'); });
  }
  handleResult(ok, q.tip);
}

/* ---- 判定 ---- */
function handleResult(ok, tip){
  Q.answered=true;
  const q=Q.list[Q.idx];
  if(ok){
    Q.rightN++; Q.combo++; Q.maxCombo=Math.max(Q.maxCombo,Q.combo);
    let add=1;
    if(Q.combo>=3) add=2;      // 连对3题额外+1
    if(Q.combo>=6) add=3;      // 连对6题及以上+3
    Q.stars+=add;
    SFX.right(); duckBgm(420);
    if(Q.combo>=3){ confetti(12); }
    showFb(true, pickPraise(), tip, '继续 →');
  } else {
    Q.combo=0;
    Q.hps--;
    SFX.wrong(); duckBgm(500);
    // 记入错题本
    S.wrongBook = S.wrongBook||[];
    S.wrongBook.unshift({
      q:q.q, right:Q.rightText, chosen:Q.answerText||'(未作答)',
      tip:tip||'', unit:Q.unit.name, ts:Date.now()
    });
    if(S.wrongBook.length>80) S.wrongBook.pop();
    S.totalQuestions++; saveNow();
    const punish = punishText();
    showFb(false,'再想一想 🤔', (tip||'')+(punish?('　'+punish):''), Q.hps<=0?'看看结果':'继续 →');
  }
  $('hpHud').textContent=Math.max(0,Q.hps);
  $('comboHud').textContent=Q.combo;
  $('starHud').textContent=Q.stars;
  save();
  if(Q.hps<=0){ setTimeout(()=>endLevel(true),900); }
}

const PRAISE=['太棒了！','答对啦！','好厉害！','你真聪明！','完美！','就是这样！','了不起！','正确 ✓'];
function pickPraise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
function punishText(){
  const p=['（这道题已经放进错题本，别忘了复习哦）','（失去 1 颗爱心 ❤️）','（连对中断了，下一题继续加油！）'];
  return p[Math.floor(Math.random()*p.length)];
}

function showFb(ok, head, tip, btnTxt){
  $('fb').className='fb show '+(ok?'ok':'no');
  $('fbHead').textContent=ok? '🎉 '+head : '😅 '+head;
  $('fbTip').innerHTML=esc(tip||'').replace(/&#39;/g,"'");
  $('fbBtn').textContent=btnTxt;
  $('fbBtn').className='btn '+(ok?'green':'orange');
  $('fbBtn').style.flex='1';
  $('fbBtn').onclick = (Q.hps<=0 && !ok) ? ()=>endLevel(true) : nextQuestion;
}
function hideFb(){ $('fb').className='fb'; }

function nextQuestion(){
  hideFb();
  if(Q.hps<=0){ endLevel(true); return; }
  Q.idx++;
  if(Q.idx>=Q.list.length){ endLevel(false); return; }
  renderQuestion();
}

/* ------------------------- 结算 ------------------------- */
function endLevel(failed){
  stopTick();
  const total=Q.list.length;
  const answeredN = failed ? Math.min(total, Q.idx+1) : total;
  const rate = Q.rightN/Math.max(1,answeredN);
  // 星级：按答对率 + 剩余爱心
  let stars=0;
  if(!failed){
    if(Q.hps===3 && rate>=0.8) stars=3;
    else if(rate>=0.9) stars=3;
    else if(rate>=0.6) stars=2;
    else stars=1;
  } else {
    stars = rate>=0.6?1:0;
  }
  const key=''+Q.subIdx;
  const prev = bestStars(Q.unit.id, Q.subIdx);
  const isBest = stars>prev;

  // 写入存档
  let gainStars=0, gainCoins=0;
  if(stars>0){
    S.unitStars[Q.unit.id]=S.unitStars[Q.unit.id]||{};
    S.unitStars[Q.unit.id][key]=Math.max(prev,stars);
    S.subCleared[Q.unit.id+'-'+Q.subIdx]=true;
    gainStars = Math.max(0, stars-prev);       // 只在刷新纪录时加总星
    gainCoins = stars*3 + (isBest?5:0);        // 每次通关都给金币
    S.stars += gainStars;
    S.today.stars += stars;                    // 今日星星按本关得星计入
    S.coins += gainCoins;
  }
  Q.gainStars=gainStars; Q.gainCoins=gainCoins;
  S.totalQuestions += answeredN;
  S.totalRight += Q.rightN;
  S.today.count = (S.today.count||0)+1;
  // 宝箱：累计总星数每 8 颗掉落一个
  const chestShould = Math.floor(S.stars/8);
  if(chestShould > (S.chestsMilestone||0)){
    S.chests += (chestShould - (S.chestsMilestone||0));
    S.chestsMilestone = chestShould;
  }
  saveNow();
  showResult(stars, failed, rate);
}

function showResult(stars, failed, rate){
  const emoji = failed ? '😢' : (stars===3?'🏆':stars===2?'🎉':stars===1?'👍':'💪');
  let title = failed ? '爱心用完啦，再试一次吧！' : (stars===3?'三星通关！太厉害了！':stars===2?'两星通关，很棒！':stars===1?'通关啦，继续加油！':'差一点点～');
  let html='<div class="res-inner">';
  html+='<div class="res-star">'+emoji+'</div>';
  html+='<div class="res-title">'+esc(title)+'</div>';
  html+='<div class="res-sub">'+esc(Q.unit.name)+' · '+esc(Q.sub.name)+'</div>';

  html+='<div style="font-size:36px;margin-top:14px;letter-spacing:5px;">';
  for(let i=0;i<3;i++){ html+='<span style="opacity:'+(i<stars?1:.22)+'">⭐</span>'; }
  html+='</div>';

  html+='<div class="res-card">'
    +'<div class="res-line"><span>答对题数</span><b>'+Q.rightN+' / '+Q.list.length+'</b></div>'
    +'<div class="res-line"><span>本关得星</span><b>⭐ '+Q.stars+'</b></div>'
    +'<div class="res-line"><span>最高连对</span><b>⚡ '+Q.maxCombo+'</b></div>'
    +'<div class="res-line"><span>剩余爱心</span><b>'+Math.max(0,Q.hps)+' / 3</b></div>'
    +'<div class="res-line"><span>计入总星</span><b>+'+(Q.gainStars||0)+' ⭐</b></div>'
    +'<div class="res-line"><span>获得金币</span><b>🪙 +'+(Q.gainCoins||0)+'</b></div>'
    +'</div>';

  // 本关错题
  const recent = (S.wrongBook||[]).filter(w=>w.unit===Q.unit.name).slice(0,3);
  if(recent.length && !failed){
    html+='<div class="wrong-list"><div style="font-size:13.5px;font-weight:900;color:#8895AE;margin-bottom:8px;">📕 错题回顾</div>';
    recent.forEach(w=>{
      html+='<div class="wrong-item"><div class="wq">'+esc(w.q)+'</div>'
        +'<div class="wa">正确答案：'+esc(w.right)+'</div></div>';
    });
    html+='</div>';
  }

  html+='<div style="display:flex;gap:9px;margin-top:16px;">'
    +'<button class="btn gray" style="flex:1" onclick="backToMap()">🏠 关卡地图</button>'
    +'<button class="btn '+(failed?'orange':'green')+'" style="flex:1.3" onclick="'+(failed?'retryLevel()':'nextSubLevel()')+'">'+(failed?'🔄 再试一次':'➡️ 下一关')+'</button>'
    +'</div>';
  html+='</div>';
  $('resInner').innerHTML=html;
  show('result');
  bgm(failed ? 'lose' : 'win');        // 结算专属音乐
  if(!failed && stars>=2){ SFX.star(); confetti(40); flyStar(); duckBgm(900); }
  if(!failed && stars===3){ setTimeout(()=>{ SFX.levelup(); duckBgm(1100); }, 260); }

  // 达标检查
  if(S.today.ms>=DAILY_GOAL_MS && !S.today.celebrated){
    S.today.celebrated=true; saveNow();
    setTimeout(()=>{ confetti(60); SFX.chest(); duckBgm(1000); toast('🎉 今日 20 分钟学习目标达成！',2400); },1400);
  }
}
function backToMap(){ renderMap(); refreshHomeStats(); show('map'); bgm('home'); }
function nextSubLevel(){
  const li=Q.levelIdx, si=Q.subIdx;
  const lv=LEVELS[li];
  if(si+1 < lv.subs.length){
    startLevel(li, si+1);
  } else if(li+1 < LEVELS.length){
    const nl=LEVELS[li+1];
    toast('🎊 恭喜通关「'+lv.name+'」！进入新单元：'+nl.emoji+' '+nl.name, 2600);
    setTimeout(()=>{ startLevel(li+1, 0); }, 700);
  } else {
    toast('🏆 全部关卡都通关啦！你太厉害了！', 2600);
    setTimeout(backToMap, 900);
  }
}
function retryLevel(){ startLevel(Q.levelIdx, Q.subIdx); }
function quitPlay(){
  if(Q.answered || Q.idx>0){
    if(!confirm('确定要退出这一关吗？本关进度不会保存哦。')) return;
  }
  stopTick(); backToMap();
}

/* ------------------------- 宝箱 ------------------------- */
function openChest(){

  S.chests--;
  const r=CHEST_REWARDS[Math.floor(Math.random()*CHEST_REWARDS.length)];
  SFX.chest();
  let apply='';
  if(r.type==='coin'){ S.coins+=50; apply='金币已到账！'; }
  else if(r.type==='avatar'){ if(S.avatars.indexOf(r.emoji)<0){ S.avatars.push(r.emoji); apply='新头像已解锁！'; } else apply='又收集到一个～'; }
  else if(r.type==='badge'){ if(S.badges.indexOf(r.name)<0){ S.badges.push(r.name); apply='勋章已挂上墙！'; } else apply='又收集到一个～'; }
  else apply=r.desc;

    +'<div class="cr-n">'+esc(r.name)+'</div>'
    +'<div class="cr-d">'+esc(apply)+'</div></div>'
    +'<div class="modal-actions"><button class="btn green" onclick="closeModal();renderMap();refreshHomeStats();">收下啦！</button></div>';

}

/* ------------------------- 勋章墙 ------------------------- */

function setAvatar(a){ S.avatar=a; saveNow(); refreshHomeStats(); openWall(); SFX.tap(); }

/* ------------------------- 错题本 ------------------------- */
function openWrongBook(){
  const list=(S.wrongBook||[]);
  let html='<div class="modal-title">📕 错题本（'+list.length+'）</div>';
  if(!list.length){
    html+='<div style="text-align:center;font-size:14px;font-weight:800;color:#8895AE;padding:24px 8px;line-height:1.7;">还没有错题，太棒啦！<br>继续保持～ 🎉</div>';
  } else {
    list.slice(0,20).forEach(w=>{
      html+='<div class="wrong-item"><div class="wq">'+esc(w.q)+'</div>'
        +'<div class="wa">✅ '+esc(w.right)+(w.tip?('　💡 '+esc(w.tip)):'')+'</div>'
        +'<div style="font-size:11px;color:#A8B3C7;font-weight:800;margin-top:5px;">'+esc(w.unit||'')+'</div></div>';
    });
  }
  html+='<div class="modal-actions">'
    +(list.length?'<button class="btn red sm" onclick="clearWrong()">清空</button>':'')
    +'<button class="btn sm" style="flex:1" onclick="closeModal()">关闭</button></div>';
  $('modalBox').innerHTML=html; $('modal').classList.add('show');
}
function clearWrong(){ if(confirm('确定清空错题本吗？')){ S.wrongBook=[]; saveNow(); openWrongBook(); } }

/* ------------------------- 设置 ------------------------- */
function openSettings(){
  let html='<div class="modal-title">⚙️ 设置</div>';
  html+='<div class="card" style="box-shadow:none;background:#F7F9FE;margin-bottom:12px;">'
    +'<div style="font-size:14px;font-weight:900;color:#3F4E6B;margin-bottom:9px;">🗓️ 每日目标：20 分钟</div>'
    +'<div style="font-size:12.5px;font-weight:700;color:#7C8BA6;line-height:1.6;">'
    +'今天已学 <b style="color:#6C5CE7">'+todayMin()+'</b> 分钟<br>'
    +'今日获得 <b style="color:#FF9524">'+S.today.stars+'</b> 颗星星</div>'
    +'</div>';
  html+='<div class="card" style="box-shadow:none;background:#F7F9FE;margin-bottom:12px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;">'
    +'<div style="font-size:14px;font-weight:900;color:#3F4E6B;">🔊 游戏音效</div>'
    +'<button class="btn sm '+(S.sound?'green':'gray')+'" onclick="toggleSound()">'+(S.sound?'已开启':'已关闭')+'</button>'
    +'</div></div>';
  // 背景音乐
  html+='<div class="card" style="box-shadow:none;background:#F3F7FF;margin-bottom:12px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(S.music?'11px':'0')+';">'
    +'<div style="font-size:14px;font-weight:900;color:#3F4E6B;">🎵 背景音乐</div>'
    +'<button class="btn sm '+(S.music?'green':'gray')+'" onclick="toggleMusic()">'+(S.music?'已开启':'已关闭')+'</button>'
    +'</div>';
  if(S.music){
    const pct=Math.round((S.musicVol==null?.55:S.musicVol)*100);
    html+='<div style="display:flex;align-items:center;gap:10px;">'
      +'<span style="font-size:15px;flex:none;">🔉</span>'
      +'<input type="range" min="0" max="100" value="'+pct+'" oninput="setMusicVol(this.value)" '
      +'style="flex:1;height:26px;accent-color:#6C5CE7;cursor:pointer;">'
      +'<span style="font-size:15px;flex:none;">🔊</span>'
      +'<b id="volNum" style="font-size:13px;color:#6C5CE7;width:34px;text-align:right;">'+pct+'%</b>'
      +'</div>';
  }
  html+='</div>';
  html+='<div class="card" style="box-shadow:none;background:#FFF7F6;margin-bottom:12px;">'
    +'<div style="font-size:13.5px;font-weight:900;color:#C0392B;margin-bottom:8px;">👨‍👩‍👧 家长须知</div>'
    +'<div style="font-size:12.5px;font-weight:700;color:#8A6A66;line-height:1.75;">'
    +'· 单次游戏最多 25 分钟，到时自动结束<br>'
    +'· 答错会扣爱心（3 颗爱心用完需重来）<br>'
    +'· 错题自动进入错题本，方便复习<br>'
    +'· 建议每天固定时段玩 20 分钟<br>'
    +'· 音乐音量可调，睡觉前建议调低或关闭</div>'
    +'</div>';
  html+='<div class="modal-actions">'
    +'<button class="btn red sm" onclick="resetAll()">重置进度</button>'
    +'<button class="btn sm" style="flex:1" onclick="closeModal()">关闭</button></div>';
  $('modalBox').innerHTML=html; $('modal').classList.add('show');
}
function toggleSound(){
  S.sound=!S.sound; saveNow();
  if(!S.sound){ bgmStop(); } else if(S.music){ bgm(MUSIC.current()||curSceneBgm()); }
  openSettings();
}
function toggleMusic(){
  S.music=!S.music; saveNow();
  if(S.music){ applyMusicVolume(); bgm(MUSIC.current()||curSceneBgm()); }
  else { bgmStop(); }
  openSettings();
}
function setMusicVol(v){
  S.musicVol = Math.max(0, Math.min(100, parseInt(v,10)|0))/100;
  const el=$('volNum'); if(el) el.textContent=Math.round(S.musicVol*100)+'%';
  applyMusicVolume(); save();
}
/* 根据当前界面猜一个合适的 BGM（用于开关切换后立即续播） */
function curSceneBgm(){
  if($('play').classList.contains('active')){
    const lv=LEVELS[Q==null?0:Q.levelIdx]; return lv?lv.id:'home';
  }
  if($('result').classList.contains('active')) return 'win';
  return 'home';
}
function resetAll(){
  if(!confirm('确定要清空所有进度重新开始吗？此操作不可恢复。')) return;
  if(!confirm('真的要重置吗？星星、勋章、错题本都会清空哦。')) return;
  S=defaultSave(); saveNow(); closeModal(); refreshHomeStats(); renderMap();
  toast('已重置，重新开始冒险吧！');
}

/* ------------------------- 时间到 ------------------------- */
function onSessionTimeUp(){
  stopTick();
  let html='<div class="timeup-emoji">⏰</div>'
    +'<div class="timeup-title">今天学得够多啦！</div>'
    +'<div class="timeup-desc">你已经连续学习很久了，眼睛需要休息一下。<br>'
    +'去户外看看远处吧，明天再来闯关！🌳<br><br>'
    +'<b style="color:#6C5CE7">今日学习：'+todayMin()+' 分钟</b><br>'
    +'<b style="color:#FF9524">今日星星：⭐ '+S.today.stars+'</b></div>'
    +'<div class="modal-actions"><button class="btn green" onclick="closeModal();stopTick();backToMap();">好的，我休息啦 👋</button></div>';
  $('modalBox').innerHTML=html; $('modal').classList.add('show');
  SFX.timeup(); duckBgm(1600); bgmStop();
}

/* ------------------------- 启动 ------------------------- */
window.addEventListener('load',()=>{
  refreshHomeStats();
  renderMap();
  sessionStart=Date.now();
  startTick();
  // 移动端需要用户交互才能出声：首次点击/触摸时解锁音频并起播 BGM
  function firstTouch(){
    const c=ac(); if(c&&c.state==='suspended') c.resume();
    const m=MUS(); if(m) m.unlock();
    if(musicEnabled()){ applyMusicVolume(); bgm(curSceneBgm()); }
    document.removeEventListener('touchstart',firstTouch);
    document.removeEventListener('click',firstTouch);
    document.removeEventListener('keydown',firstTouch);
  }
  document.addEventListener('touchstart',firstTouch,{passive:true});
  document.addEventListener('click',firstTouch);
  document.addEventListener('keydown',firstTouch);
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopTick(); saveNow(); bgmStop(); }
  else {
    sessionStart=Date.now(); if(!tickTimer) startTick(); refreshHomeStats();
    if(musicEnabled() && document.querySelector('.screen.active')){
      applyMusicVolume(); bgm(curSceneBgm());
    }
  }
});
window.addEventListener('beforeunload',saveNow);

</script>
</body>
</html>
