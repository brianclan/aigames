     {t:'大项不当扩大。', fb:'回写：「大项『猫』在大前提『所有猫是动物』中作全称主项→周延，在结论『所有狗是猫』中作谓项（肯定）→不周延。大项前提周延、结论不周延，没扩大。你判错了。」'},

    teachAll:'正是。你当年那张截图，是「中项」——你拿它同时当「全部真相的证据」和「该转发的理由」，可那个中项在「图是真的」和「转它是对的」两个前提里，一次都没周延过。中项周延规则：中项 M 必须在前提中至少周延一次，才能把 S 和 P 真正扣住。「动物」在两句「……是动物」里都作肯定谓项，管不到全体动物，所以扣不住「猫」和「狗」。你高一那次，也是同一个中项，两次都没周延，结论「该转」就飞出去了。中项不周延，是这座穹顶最常吐歪石的原因——也是你从前最隐蔽的病。',
    cls:'正确答案：A。解析要点：中项「动物」在两肯定命题中均作谓项→均不周延，违反「中项在前提中至少周延一次」，称中项不周延谬误（亦可视作四词项问题）。此即谈微高一转发的推理原形。错误选项对应误解：B 大项不当扩大（大项「猫」前提周延、结论不周延，未扩大）；C 小项不当扩大（「狗」两处均全称周延）；D 两否定（前提皆肯定，非此）。',

     {t:'中项不周延。', fb:'回写：「中项『中国人』在此被偷换——根因是四概念（两个不同概念共用一字），不是单纯不周延。你没看穿『同名异实』。」'},
     {t:'大项不当扩大。', fb:'回写：「大项『勤劳勇敢的』在前提作肯定谓项→不周延，在结论也作肯定谓项→不周延，没扩大。」'},
     {t:'小项不当扩大。', fb:'回写：「小项『我』在两处都是单称主项→都周延，没扩大。」'}
    ],
    teachAll:'字同，实不同。大前提「中国人是勤劳勇敢的」里的「中国人」，是集合概念——指「中华民族整体」这个集体，说的是民族作为一个整体的属性，不能分给其中任何一个人。小前提「我是中国人」里的「中国人」，是非集合概念——指「我作为中华民族的一个成员」，是个体的类属。两个「中国人」其实是两个不同的词项，推理于是有了四个词项（中国人〔集合〕、勤劳勇敢的、我、中国人〔非集合〕），中项根本没统一，机器拒绝咬合。这正承接第一层「偷换概念」、第二层「定义过宽」——在词项层，它们升级成了「四概念」。你高一那件事也一样：把「沈同学」这个具体的人，塞进「小偷」这个你没证实的集合，也是用集合义乱了非集合义。',
    cls:'正确答案：A。解析要点：大前提「中国人」是集合概念（指整体民族），小前提「中国人」是非集合概念（指个体），二者实为不同概念，偷换致四个词项（四概念／四词项谬误）。此正承接第一层「偷换概念」、第二层「定义过宽」在词项层的重现。错误选项对应误解：B 中项不周延（中项「中国人」在此被偷换，根因是四概念而非单纯不周延）；C/D 大／小项扩大（此处未涉及）。',
    re:'念「A。四概念——『中国人』大前提集合义、小前提非集合义，偷换致四个词项。」主轴落定，机器「咔」地一声，像把两枚错位的齿掰回原位。'

   {

    a:[

     {t:'「人会死，苏格拉底是人，所以苏格拉底会死。」', fb:'回写：「这是有效式（Barbara 的实例）。大项『会死』前提周延（全称主项）、结论也周延，没扩大。你误以为有错。」'},
     {t:'「所有猫是动物，所有狗是动物，所以狗是猫。」', fb:'回写：「这是中项不周延（『动物』两不周延）。你判错了种类。」'},
     {t:'「有的鸟会飞，企鹅是鸟，所以企鹅会飞。」', fb:'回写：「这是中项不周延——『鸟』在大前提『有的鸟会飞』作特称主项→不周延，在小前提『企鹅是鸟』作肯定谓项→不周延，两处皆不周延。不是小项扩大。你判错了种类。」'}

    teachAll:'对，这就是「大项不当扩大」（ illicit major ）。规则：前提中不周延的项，在结论中不得周延。大项「珍贵」在大前提「所有艺术品都珍贵」里是肯定命题的谓项——肯定命题的谓项只说了一部分（艺术品是珍贵之物里的一部分），管不到「珍贵」的全部，所以不周延。可到了结论「这石头不珍贵」，「珍贵」是否定命题的谓项——否定命题把「珍贵」整个排除在这石头之外，管到了「珍贵」的全部，所以周延。同一个项，前提里只管一部分，结论里管了全体，这就「扩大」了。注意它的对称病叫「小项不当扩大」（小项结论周延而前提不周延），两者同一条规则管。你刚才把 D 当成小项扩大，其实 D 是中项不周延——凡见「有的……是」和「是……」拼的，先查中项，再查大小项。',
    cls:'正确答案：A。解析要点：大项「珍贵」在大前提「所有艺术品都珍贵」中作肯定命题谓项→不周延，在结论「这石头不珍贵」中作否定命题谓项→周延，违反「前提中不周延的项结论不得周延」，即大项不当扩大（非法扩大）。B 有效；C 中项不周延；D 中项不周延（「鸟」两前提均不周延）。错误选项对应误解：B 误以为有错（实则有效式）；C 中项不周延（误把一切错推都归此类）；D 小项不当扩大（误判错误种类，实为四概念／中项不周延混）。',
    re:'念「A。大项『珍贵』前提不周延、结论周延，犯大项不当扩大。」主轴落定，星图第一格旁侧亮起一行小字：「规则：前提不周延之项，结论不得周延。」'

    ],
    teachAll:'正是。省略三段论（enthymeme）不是错，是日常论证的常态——人说话省四肢之一，靠听者自己补。但省掉的那一肢，往往是论证最该被检视的地方，因为它最不敢写。你那句「真实最重要，所以稿子都该真实」，省掉的也是大前提：「凡最重要的价值，就都该成为事实（都该被实现）」。这一个大前提，不是事实，是你的价值判断——你把它藏起来，假装它是事实，「所以」才显得牢。补全它，不是要你删掉它，是要你把它亮出来，让人看见：你这一步，靠的是一个你认领的、可争议的价值，不是一块免证的石头。这，就是你回现实要当着周老师说的那半句。',

    '群里刚炸开一条。一张角度歪斜的截图：同班的小裴，坐在自习室靠窗的位置，手伸进前排一个人的抽屉。配文是体育委员发的：「怪不得最近总丢东西，原来是他。」底下已经接了二十几条，大半是「离他远点」「门都不敢锁了」。小裴没有回。谈微点开他的头像，最后一条动态停在三天前——「U盘又找不着了，谁看见吱一声」，配一张空桌面的图。',
    '她盯着那张截图。右耳上方那缕灰白头发在日光灯下没有发光——现实里它不发光，只有塔里矛盾场压发作时才亮。她口袋里坠着四样东西：名实铜尺、定义的四把刀、对当罗盘、青铜推理齿，沉甸甸往一边坠，像给她挂了四枚秤砣。可这四枚秤砣，此刻没有一枚接得住眼前这件事。',
    '她认得这套句式。和她高一那张「沈同学偷钱包」的截图，是同一种——把一个人塞进「小偷」这个没证实的框，再让所有人都默认框是对的。她张了张嘴，旧习惯先到：一句「大家先别急着定论嘛」已经在舌尖转了半圈，右手食指无意识地在指间转起了手机。',
    '可她没说出来。',
    '第四关那场论辩的余温还在。亚里士多德胸腔三腔停转的那一刻，她第一次懂了「赢不了」——不是输，是有些话你圆不回去，因为圆回去也是空的。她看着手机屏幕上小裴那个沉默的头像，忽然明白：一句「别急着定论」的圆场话，救不了小裴。它只会让所有人都「再看看」，然后慢慢忘了去看。',
    '她想替他说一句话。一句真正站得住的话。',
    '可她卡住了。她不知道怎么说。她手里有青铜推理齿，能拆三段论，可这不是三段论——这是「一个人是不是小偷」的断定，要立的不是一个推理，是一个主张。主张底下得有什么？她不知道。她只觉得胸口有一句更笨的话在往上顶——',
    '「我相信小裴没拿。」',
    '她把这句话在喉咙里含了三秒。然后她自己先否了它：你凭什么信？你没看见U盘在他座位下找到，你只是觉得截图角度不对。你这句「我相信」，和沈同学当年没人肯说的那句「我不是」，是同一种没有根据的话。你 proving 不了它。',
    '她没把这句话发出去。她把手机扣在胸口，像第一关那晚一样。可这次她不是因为愧，是因为她第一次清清楚楚看见：自己有两种话想说——一种要立得住（她还没学会怎么立），一种明知道立不住、可不说人会碎。四件工具都接不住第二种。'

/* ==== 引擎 ==== */
/* ================= 名理之塔 · 引擎 ================= */
const KEY = 'mltower_v2';
const DEF = () => ({ v: 2, teach: false, bag: [], seen: {}, inited: false });
let S = DEF();

/* ---------- 存档 ---------- */
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const o = JSON.parse(r); if (o && o.v === 2) S = Object.assign(DEF(), o); }
  } catch (e) { }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function lp(id) {            // 取某层的进度卡，不存在则建
  if (!S.seen[id]) S.seen[id] = { i: 0, qi: 0, sub: null, done: [], x: [], txt: '', fin: false, ms: 0, st: 0, scars: 0, ding: 0, wrong: {} };
  return S.seen[id];
}
function L(id) { return LAYERS.find(l => l.id === id) || LAYERS[0]; }
function scenes(id) { return L(id).scenes; }

/* ---------- 日志：每题 / 每轮的行为记录 ---------- */
function now() { return Date.now(); }
function logQ(lid, key, title, ok, ms) {
  const p = lp(lid);
  if (p.wrong[key] === undefined) p.wrong[key] = ok ? 1 : 0;   // 首答为准，重证不覆盖
  const g = S.log = S.log || [];
  g.push({ t: now(), lid, key, title: String(title || '').slice(0, 26), ok: ok ? 1 : 0, ms: ms || 0 });
  if (g.length > 4000) g.splice(0, g.length - 4000);
  save();
}

/* ---------- 计时 ---------- */
function enterLayer(id) { const p = lp(id); if (!p.st) p.st = now(); save(); }
function flushLayer(id) { const p = lp(id); if (p.st) { p.ms += now() - p.st; p.st = now(); } save(); }
function leaveLayer(id) { const p = lp(id); if (p.st) { p.ms += now() - p.st; p.st = 0; } save(); }

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage');
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }
function tone(t) { document.body.className = t ? ('tone-' + t) : '' }
function setSkin(ac, ac2) {
  const r = document.body.style;
  r.setProperty('--ac', ac);
  r.setProperty('--ac2', ac2 || ac);
  const hex = ac.replace('#', '');
  const n = parseInt(hex, 16);
  const R = (n >> 16) & 255, G = (n >> 8) & 255, B = n & 255;
  r.setProperty('--acsoft', 'rgba(' + R + ',' + G + ',' + B + ',.08)');
  r.setProperty('--acline', 'rgba(' + R + ',' + G + ',' + B + ',.28)');
}
function ps(arr, cls) { return (arr || []).map((t, i) => '<p' + (cls ? ' class="' + cls + '"' : '') + ' style="animation-delay:' + (i * 70) + 'ms">' + t + '</p>').join('') }
function notes(ns) { return (ns || []).map(n => '<div class="note' + (n.k === '系统' || n.k === 'sys' ? ' sys' : '') + '"><b>' + n.k + '</b> · ' + n.v + '</div>').join('') }
function head(sc) { let s = ''; if (sc.sc) s += '<h2 class="sc">' + sc.sc + '</h2>'; if (sc.title) s += '<h1 class="ct">' + sc.title + '</h1>'; return s }
function tip(sc) { return sc.tip ? '<div class="tip' + (S.teach ? '' : ' hide') + '">' + sc.tip + '</div>' : '' }
function dlg(d) { return (d || []).map(x => '<div class="dlg" style="border-left-color:' + (x.c || 'var(--ac2)') + '"><span class="who">' + x.who + '</span>' + x.t + '</div>').join('') }

/* ---------- 路由 ---------- */
let R = { home: 'map', lid: null, i: 0, sub: null, qi: 0 };
function hashOf() {
  const h = (location.hash || '').replace(/^#/, '');
  if (h === 'teach') return { home: 'teach' };
  if (h === 'map' || h === '') return { home: 'map' };
  const m = h.split('/');
  const lid = m[0] in (LAYERS.reduce((a, l) => (a[l.id] = 1, a), {})) ? m[0] : 'L1';
  return { home: 'layer', lid, i: +(m[1] || 0), sub: m[2] === '' || m[2] === undefined ? null : +m[2], qi: +(m[3] || 0) };
}
function href(r) {
  if (r.home === 'map') return '#map';
  if (r.home === 'teach') return '#teach';
  return '#' + r.lid + '/' + r.i + '/' + (r.sub === null || r.sub === undefined ? '' : r.sub) + '/' + (r.qi || 0);
}
function nav(r) { location.hash = href(r) }
function route() {
  const h = hashOf();
  const prev = R;
  if (prev.home === 'layer' && prev.lid && (h.home !== 'layer' || h.lid !== prev.lid)) leaveLayer(prev.lid);
  R = h;
  if (R.home === 'map') { renderMap(); return }
  if (R.home === 'teach') { renderTeach(); return }
  const p = lp(R.lid);
  if (R.i === 0 && !R.sub && !R.qi) { p.i = 0 }                       // 从外部进入 → 落到上次位置
  if (R.i !== p.i) p.i = Math.max(0, Math.min(scenes(R.lid).length - 1, R.i));
  R.i = p.i; R.qi = p.qi || 0;
  enterLayer(R.lid);
  render();
}
window.addEventListener('hashchange', route);

/* ---------- 渲染：场景 ---------- */
function render() {
  const id = R.lid, arr = scenes(id), sc = arr[R.i], p = lp(id);
  if (sc.type === 'summary' && !p.fin) { p.fin = true; save(); }   // 抵达结算即视为通过
  const ly = L(id);
  setSkin(ly.accent, ly.accent2);
  tone(sc.tone || '');
  hud(ly, sc);
  let html = '';
  if (sc.type === 'title') html = rTitle(ly, sc, p, id);
  else if (sc.type === 'prose') html = rProse(sc);
  else if (sc.type === 'input') html = rInput(sc);
  else if (sc.type === 'explore') html = rExplore(sc);
  else if (sc.type === 'quiz') html = '<div id="qz"></div>';
  else if (sc.type === 'boss') html = '<div id="qz"></div>';
  else if (sc.type === 'reveal') html = rReveal(sc);
  else if (sc.type === 'summary') html = rSummary(ly, sc, p, id);
  stage.innerHTML = '<div class="fade">' + html + '</div>';
  bind(sc);
  if (sc.type === 'quiz') qshow(false);
  if (sc.type === 'boss') qshow(true);
  window.scrollTo(0, 0);
}
function hud(ly, sc) {
  $('#hScar').textContent = '裂痕 ' + lp(R.lid).scars;
  $('#hScar').style.visibility = 'visible';
  $('#hTip').style.visibility = 'visible';
  $('#hTip').textContent = S.teach ? '教学' : '教学 ·关';
  $('#hTip').className = 'chip' + (S.teach ? ' on' : '');
  const arr = scenes(R.lid), done = lp(R.lid).done.length;
  $('#pBar').style.width = Math.min(100, Math.round(done / arr.length * 100)) + '%';
  $('#hLv').textContent = ly.name + ' · ' + ly.who;
}

function rTitle(ly, sc, p, id) {
  const n = ly.scenes.filter(s => s.type === 'quiz').reduce((a, s) => a + s.qs.length, 0);
  const b = ly.scenes.filter(s => s.type === 'boss').reduce((a, s) => a + s.rounds.length, 0);
  const ns = (sc.notes || []).concat([
    { k: '本层教学单元', v: ly.unit }, { k: '建议投放', v: ly.week },
    { k: '预计时长', v: ly.dur }, { k: '本层谬误', v: ly.fallacies },
    { k: '容量', v: '答题 ' + n + ' 题 · 论辩 ' + b + ' 轮' }]);
  return head(sc) + ps(sc.body, 'ind') + notes(ns) + '<div class="kv">' + (sc.meta || '') + '</div>' +
    '<button class="btn pri" data-act="go">' + (sc.btn || '进入本层') + '</button>' +
    '<button class="btn sm" data-act="back">返回塔层</button>';
}
function rProse(sc) {
  return head(sc) + dlg(sc.dlg) + ps(sc.body, 'ind') + ps(sc.bodyTail) + notes(sc.notes) + tip(sc) +
    (sc.hook ? '<div class="hook">' + sc.hook + '</div>' : '') +
    '<button class="btn pri" data-act="next">' + (sc.btn || '继续') + '</button>';
}
function rInput(sc) {
  return head(sc) + ps(sc.body, 'ind') + notes(sc.notes) + tip(sc) +
    '<textarea id="ta" placeholder="' + sc.ph + '"></textarea>' +
    '<div class="kv" style="font-size:12px;color:#8a7f70">' + sc.hint + '</div>' +
    ps(sc.res, 'ind') +
    '<button class="btn pri" data-act="next">' + (sc.btn || '继续') + '</button>';
}
function rExplore(sc) {
  const p = lp(R.lid);
  if (R.sub !== null && R.sub !== undefined) {
    const it = sc.items[R.sub];
    return head(it) + ps(it.body, 'ind') + notes(it.notes) +
      (it.tag ? '<div class="note sys"><b>记入</b> · ' + it.tag + '</div>' : '') +
      '<button class="btn" data-act="back">返回道场</button>';
  }
  const seen = sc.items.filter(x => p.x.indexOf(x.id) >= 0).length;
  return head(sc) + ps(sc.body, 'ind') +
    '<div class="grid">' + sc.items.map((it, k) => '<button class="hot' + (p.x.indexOf(it.id) >= 0 ? ' done' : '') + '" data-ex="' + k + '"><span class="n">探索点 ' + (k + 1) + '</span>' + it.label + '</button>').join('') + '</div>' +
    '<div class="kv" style="font-size:12.5px;color:#8a7f70">已勘 ' + seen + ' / ' + sc.items.length + (seen < sc.items.length ? ' · 全部勘过才能前行' : ' · 道场已勘尽') + '</div>' +
    notes(sc.notes) + tip(sc) +
    (seen >= sc.items.length ? '<button class="btn pri" data-act="next">' + (sc.btn || '继续深入') + '</button>' : '');
}
function rReveal(sc) {
  return head(sc) + ps(sc.body, 'ind') + dlg(sc.dlg) + notes(sc.notes) + tip(sc) +
    (sc.hook ? '<div class="hook">' + sc.hook + '</div>' : '') +
    '<button class="btn pri" data-act="next">' + (sc.btn || '继续') + '</button>';
}
function rSummary(ly, sc, p, id) {
  leaveLayer(id);
  const n = ly.scenes.filter(s => s.type === 'quiz').reduce((a, s) => a + s.qs.length, 0);
  const b = ly.scenes.filter(s => s.type === 'boss').reduce((a, s) => a + s.rounds.length, 0);
  const tot = n + b, keys = Object.keys(p.wrong), bad = keys.filter(k => !p.wrong[k]).length;
  const ans = keys.filter(k => /-q\d/.test(k)).length;
  const qbad = keys.filter(k => /-q\d/.test(k) && !p.wrong[k]).length;
  const giftId = 'g_' + id + '_' + R.i;
  const mm = Math.max(1, Math.round(p.ms / 60000));
  return head(sc) + '<div class="stat">' +
    '<div><div class="l">塔身裂痕</div><div class="v">' + p.scars + '</div></div>' +
    '<div><div class="l">廌鸣次数</div><div class="v">' + p.ding + '</div></div>' +
    '<div><div class="l">答题准确率</div><div class="v">' + (ans ? Math.round((ans - qbad) / ans * 100) + '%' : '—') + '</div></div>' +
    '<div><div class="l">本层用时</div><div class="v">' + mm + '<span style="font-size:12px"> 分</span></div></div>' +
    '</div>' + notes(sc.notes) +
    '<div class="kv"><span>工具囊（全塔累计）</span>' + (S.bag.join('　') || '空') + '</div>' +
    '<div class="kv"><span>统计口径</span>本层 ' + tot + ' 个作答节点，已作答 ' + keys.length + ' 个，首答未通过 ' + bad + ' 个。用时按 lesson 计入本层，仅本机保存。</div>' +
    ps(sc.body, 'ind') +
    '<button class="btn pri" data-act="back">回到塔层</button>' +
    '<button class="btn sm" data-act="reset">清空本层 · 重来一次</button>';
}

/* ---------- 作答区 ---------- */
function optHtml(a) { return a.map((o, k) => '<button class="opt" data-o="' + k + '"><span style="color:#8a7f70">' + 'ABCD'[k] + '</span>&nbsp;&nbsp;' + o.t + '</button>').join('') }
function qshow(isBoss) {
  const sc = scenes(R.lid)[R.i], p = lp(R.lid), i = R.qi || 0, retry = !!p.rt;
  const arr = isBoss ? sc.rounds : sc.qs, q = arr[i];
  let h = '<h2 class="sc">' + sc.sc + '</h2>';
  if (!isBoss) h += '<div class="door ' + (q.door || 'L') + '"><div class="dh">' + q.dh + '</div><div class="q">' + q.q + '</div></div>';
  else h += '<h1 class="ct">' + q.title + '</h1>' + (i === 0 ? notes(sc.notes) : '') + dlg(q.lines) + ps(q.body, 'ind') +
    '<div class="note sys"><b>你要做的</b> · ' + q.task + '</div>';
  h += '<div id="opts">' + optHtml(q.a) + '</div><div id="fb"></div>';
  if (!isBoss && i === 0 && !retry) h += '<div class="kv" style="font-size:12px;color:#8a7f70">' + sc.how + '</div>';
  if (isBoss ? i === 0 : (i === 0 && !retry)) h += tip(sc);
  const box = $('#qz'); box.innerHTML = '<div class="fade">' + h + '</div>';
  box.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => answer(isBoss, i, +b.dataset.o, q));
  const t = $('#hScar'); if (t) $('#pBar').style.width = Math.min(100, Math.round((p.done.length + i / arr.length) / scenes(R.lid).length * 100)) + '%';
}
function answer(isBoss, i, k, q) {
  const p = lp(R.lid), sc = scenes(R.lid)[R.i], o = q.a[k], area = $('#fb');
  const key = R.lid + '#s' + R.i + '#' + (isBoss ? 'b' : 'q') + i;
  const ms = p.tk ? Math.min(600000, now() - p.tk) : 0;
  document.querySelectorAll('#opts .opt').forEach((b, j) => { b.className = 'opt' + (j === k ? (o.ok ? ' ok' : ' bad') : ''); b.disabled = true });
  logQ(R.lid, key, isBoss ? q.title : q.q, !!o.ok, ms);
  let t = '';
  if (o.ok) {
    if (o.act) t += '<div class="rub good"><span class="who">' + (isBoss ? L(R.lid).who : '门') + '</span>' + o.act + '</div>';
    if (o.teach || q.teachAll) t += '<div class="rub">' + (o.teach || q.teachAll) + '</div>';
    if (o.cls || q.cls) t += '<div class="note"><b>命题拆解</b> · ' + (o.cls || q.cls) + '</div>';
    if (o.ding) { p.ding++; $('#hScar').textContent = '叮'; setTimeout(() => hud(L(R.lid), sc), 700) }
    const last = i >= (isBoss ? sc.rounds.length : sc.qs.length) - 1;
    t += '<button class="btn pri" data-a="' + (last ? 'fin' : 'nq') + '">' + (last ? (sc.nextLabel || '继续前行') : '下一题') + '</button>';
  } else {
    p.scars++; save(); $('#hScar').textContent = '裂痕 ' + p.scars;
    if (o.ding) p.ding++;
    if (o.fb || q.fbAll) t += '<div class="rub"><span class="who">门回写</span>' + (o.fb || q.fbAll) + '</div>';
    if (o.micro || q.microAll) t += '<div class="note"><b>谈微</b> · ' + (o.micro || q.microAll) + '</div>';
    if (o.teach || q.teachAll) t += '<div class="rub">' + (o.teach || q.teachAll) + '</div>';
    t += '<button class="btn" data-a="retry">重证 · 再说一次</button>';
  }
  save();
  area.innerHTML = '<div class="fade">' + t + '</div>';
  area.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a, arr = isBoss ? sc.rounds : sc.qs;
    if (a === 'fin') { next(); }
    else if (a === 'nq') { p.qi = i + 1; p.rt = false; p.tk = now(); R.qi = p.qi; save(); qshow(isBoss) }
    else { p.rt = true; p.tk = now(); save(); qshow(isBoss) }
  });
}

/* ---------- 流转 ---------- */
function next() {
  const p = lp(R.lid), arr = scenes(R.lid);
  if (p.done.indexOf(R.i) < 0) p.done.push(R.i);
  if (R.i >= arr.length - 1) { p.fin = true; p.qi = 0; leaveLayer(R.lid); save(); nav({ home: 'map' }); return }
  p.i = R.i + 1; p.qi = 0; p.rt = false; p.sub = null; p.tk = 0;
  if (arr[p.i].type === 'quiz' || arr[p.i].type === 'boss') p.tk = now();
  save(); nav({ home: 'layer', lid: R.lid, i: p.i, sub: null, qi: 0 });
}

/* ---------- 绑定 ---------- */
function bind(sc) {
  const p = lp(R.lid);
  if (sc.type === 'quiz' || sc.type === 'boss') { if (!p.tk) { p.tk = now(); save() } }
  stage.querySelectorAll('[data-act]').forEach(b => {
    const a = b.dataset.act;
    if (a === 'next') b.onclick = () => { capture(); flushLayer(R.lid); next() };
    else if (a === 'go') b.onclick = () => { p.i = 1; p.qi = 0; save(); nav({ home: 'layer', lid: R.lid, i: 1, sub: null, qi: 0 }) };
    else if (a === 'back') b.onclick = () => {
      if (R.sub !== null && R.sub !== undefined) { p.sub = null; save(); nav({ home: 'layer', lid: R.lid, i: R.i, sub: null, qi: 0 }) }
      else { leaveLayer(R.lid); nav({ home: 'map' }) }
    };
    else if (a === 'reset') b.onclick = () => { if (confirm('清空本层进度？作业记录与 JSON 一并清除。')) { delete S.seen[R.lid]; save(); nav({ home: 'layer', lid: R.lid, i: 0, sub: null, qi: 0 }) } };
  });
  stage.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
    const k = +b.dataset.ex, it = sc.items[k];
    if (p.x.indexOf(it.id) < 0) p.x.push(it.id);
    if (it.add && S.bag.indexOf(it.add) < 0) S.bag.push(it.add);
    p.sub = k; save(); nav({ home: 'layer', lid: R.lid, i: R.i, sub: k, qi: 0 });
  });
  const ta = $('#ta'); if (ta) { ta.value = p.txt || ''; ta.oninput = () => { p.txt = ta.value; save() } }
  $('#hTip').onclick = () => { S.teach = !S.teach; save(); render() };
  $('#hBack').onclick = () => { if (R.home === 'layer') { leaveLayer(R.lid); } nav({ home: 'map' }) };
  $('#hMenu').onclick = () => nav({ home: 'teach' });
}
function capture() { const ta = $('#ta'); if (ta) { lp(R.lid).txt = ta.value; save() } }

/* ---------- 塔层地图 ---------- */
function unlockOf(id) {
  if (id === 'LH1') { const a = lp('L1'), b = lp('L2'); return { ok: a.fin && b.fin && (a.scars + b.scars) <= 2, why: '需完成第一、二层，且两层裂痕合计 ≤ 2' } }
  if (id === 'LH2') { const a = lp('L6'); return { ok: a.fin && a.scars === 0, why: '需零裂痕通过第六层 · 连锁之网' } }
  if (id === 'LZ') { return { ok: LAYERS.filter(l => /^L\d$/.test(l.id)).every(l => lp(l.id).fin), why: '需完成全部八个可见层' } }
  return { ok: true, why: '' };
}
function renderMap() {
  setSkin('#2f5d54', '#965d28'); tone('');
  $('#pBar').style.width = '0%';
  $('#hLv').textContent = '名理之塔 · 全塔';
  $('#hScar').textContent = ''; $('#hTip').textContent = ''; $('#hTip').style.visibility = 'hidden';
  const vis = LAYERS.filter(l => /^L\d$/.test(l.id));
  const hid = LAYERS.filter(l => /^LH/.test(l.id));
  const fin = LAYERS.filter(l => l.id === 'LZ');
  const tot = LAYERS.reduce((a, l) => a + l.scenes.filter(s => s.type === 'quiz').reduce((x, s) => x + s.qs.length, 0) + l.scenes.filter(s => s.type === 'boss').reduce((x, s) => x + s.rounds.length, 0), 0);
  const doneN = LAYERS.filter(l => lp(l.id).fin).length;
  const row = l => {
    const p = lp(l.id), u = unlockOf(l.id);
    const key = Object.keys(p.wrong).length;
    const hard = Object.values(p.wrong).filter(v => !v).length;
    const nq = l.scenes.filter(s => s.type === 'quiz').reduce((a, s) => a + s.qs.length, 0) + l.scenes.filter(s => s.type === 'boss').reduce((a, s) => a + s.rounds.length, 0);
    return '<button class="mf' + (p.fin ? ' done' : '') + (u.ok ? '' : ' lock') + '" data-l="' + l.id + '" style="--c:' + l.accent + '">' +
      '<i class="bar"></i><span class="ord">' + (l.id.replace('L', '').replace('H', '隐').replace('Z', '终')) + '</span>' +
      '<span class="nm"><b>' + l.name + '</b><i>' + l.who + ' · ' + l.unit + '</i></span>' +
      '<span class="st">' + (u.ok ? (p.fin ? '已通过' : (key ? '进行中' : '未开始')) : '未解锁') + '<br>' +
      (key ? '已答 ' + key + '/' + nq + (hard ? ' · 错 ' + hard : '') : l.week) + '</span></button>';
  };
  const h = '<div class="fade">' +
    '<div class="maphead"><div class="t">名理之塔</div><div class="s">说谎者不得登塔</div></div>' +
    '<div class="tower">' +
    '<div class="sep">八层可见 · ' + vis.filter(l => lp(l.id).fin).length + ' / ' + vis.length + ' 已通过</div>' +
    vis.map(row).join('') +
    '<div class="sep">隐藏层 · 拓展与加分</div>' +
    hid.map(row).join('') +
    '<div class="sep">终章</div>' +
    fin.map(row).join('') +
    '</div>' +
    '<div class="mfoot">全塔共 ' + LAYERS.length + ' 个层位、' + tot + ' 个作答节点。进度保存在本机浏览器，换设备不同步。<br>' +
    '已通过 ' + doneN + ' / ' + LAYERS.length + '　·　教师后台在右上角 ≡（可导出错误分布与用时）</div>' +
    '</div>';
  stage.innerHTML = h;
  stage.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    const id = b.dataset.l, u = unlockOf(id);
    if (!u.ok) { alert('此层尚未解锁。\n\n' + u.why); return }
    const p = lp(id);
    nav({ home: 'layer', lid: id, i: p.fin ? 0 : (p.i || 0), sub: null, qi: 0 });
  });
  $('#hScar').style.visibility = 'hidden';
}

/* ---------- 教师后台 ---------- */
function renderTeach() {
  setSkin('#6b4a1c', '#8a5212'); tone('');
  $('#hLv').textContent = '教师后台';
  $('#pBar').style.width = '100%';
  $('#hScar').textContent = ''; $('#hScar').style.visibility = 'hidden';
  $('#hTip').textContent = ''; $('#hTip').style.visibility = 'hidden';
  const g = S.log || [];
  const byL = {};
  g.forEach(r => {
    const k = r.lid; byL[k] = byL[k] || { n: 0, bad: 0, ms: 0, items: {} };
    byL[k].n++; if (!r.ok) byL[k].bad++; byL[k].ms += r.ms;
    byL[k].items[r.key] = byL[k].items[r.key] || { title: r.title, n: 0, bad: 0, ms: 0 };
    const it = byL[k].items[r.key]; it.n++; if (!r.ok) it.bad++; it.ms += r.ms;
  });
  let rows = '';
  LAYERS.forEach(l => {
    const d = byL[l.id]; if (!d) return;
    const rate = Math.round(d.bad / d.n * 100);
    rows += '<tr><td>' + l.id + '</td><td>' + l.name + '</td><td class="n">' + d.n + '</td><td class="n">' + d.bad + '</td>' +
      '<td class="n">' + rate + '%</td><td class="n">' + Math.round(d.ms / 1000) + 's</td></tr>';
  });
  let hardRows = [];
  LAYERS.forEach(l => {
    const d = byL[l.id]; if (!d) return;
    Object.keys(d.items).forEach(k => {
      const it = d.items[k];
      if (it.bad > 0) hardRows.push({ id: l.id, k, ...it, rate: it.bad / it.n });
    });
  });
  hardRows.sort((a, b) => b.rate - a.rate || b.bad - a.bad);
  const difficult = hardRows.slice(0, 12).map(r =>
    '<tr' + (r.rate >= .5 ? ' class="hard"' : '') + '><td>' + r.id + '</td><td>' + esc(r.title) + '</td><td class="n">' + r.n + '</td>' +
    '<td class="n">' + r.bad + '</td><td class="n"><span class="bar-mini" style="width:' + Math.max(3, r.rate * 46) + 'px"></span> ' + Math.round(r.rate * 100) + '%</td></tr>').join('');

  const h = '<div class="fade">' +
    '<h2 class="sc">教学数据面板</h2><h1 class="ct">形成性评价 · 本机视图</h1>' +
    '<p style="font-size:14px;color:#6b6252">这份面板只汇总<b>本机</b>的操作记录，不联网、不上传。若要做全班分析，请让每位同学导出 JSON 后交给你，或在教师机上一并导入。</p>' +
    '<div class="teach-box"><b>怎么做全班的：</b>把下面「导出 JSON」的内容复制进一个 <code>.json</code> 文件发给你。<br>' +
    '<b>怎么读：</b>「错误分布」按层、「高频错题」按节点。错误率高的节点就是下周该讲的；平均用时长的题目通常意味着题干或选项有歧义，值得回头改题，而不是怪学生。</div>' +
    '<div class="ex"><h3>按层汇总</h3>' +
    (rows ? '<table class="tb"><tr><th>层</th><th>名称</th><th class="n">作答</th><th class="n">首答未过</th><th class="n">未过率</th><th class="n">总耗时</th></tr>' + rows + '</table>'
      : '<div style="font-size:13px;color:#8a7f70">还没有作答记录。先去任意一层做几道题。</div>') + '</div>' +
    (difficult ? '<div class="ex"><h3>高频错题 Top 12（按未过率）</h3><table class="tb">' +
      '<tr><th>层</th><th>节点</th><th class="n">作答</th><th class="n">错</th><th class="n">未过率</th></tr>' + difficult + '</table></div>' : '') +
    '<div class="ex"><h3>导出</h3>' +
    '<span class="pill" data-x="csv">导出 CSV（Excel 可直接打开）</span>' +
    '<span class="pill" data-x="json">导出 JSON</span>' +
    '<span class="pill" data-x="csvraw">导出逐次操作流水</span>' +
    '<span class="pill warn" data-x="wipe" style="border-color:rgba(163,59,52,.5);color:#a33b34">清空全部数据</span>' +
    '<pre class="exp" id="expbox">点上面任意一项，导出内容会出现在这里。</pre></div>' +
    '<div class="ex"><h3>本机概况</h3><div class="kv">' +
    '<span>已通过层位</span>' + (LAYERS.filter(l => lp(l.id).fin).map(l => l.name).join('、') || '无') +
    '<span>工具囊</span>' + (S.bag.join('　') || '空') +
    '<span>累计操作条数</span>' + g.length + ' 条' +
    '</div></div>' +
    '<button class="btn pri" data-act="back">返回塔层</button></div>';
  stage.innerHTML = h;
  const box = $('#expbox');
  const dump = t => { box.textContent = t; setTimeout(() => { box.scrollIntoView({ behavior: 'smooth', block: 'center' }) }, 60) };
  stage.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
    const x = b.dataset.x;
    if (x === 'wipe') { if (confirm('清空全部学习数据与进度？不可恢复。')) { localStorage.removeItem(KEY); S = DEF(); location.hash = '#map' } return }
    if (x === 'csv') dump(toCSV());
    if (x === 'json') dump(JSON.stringify(exportAll(), null, 1));
    if (x === 'csvraw') dump(toCSVRaw());
  });
  stage.querySelectorAll('[data-act]').forEach(b => { if (b.dataset.act === 'back') b.onclick = () => nav({ home: 'map' }) });
  $('#hBack').onclick = () => nav({ home: 'map' });
}
function exportAll() {
  const layers = {};
  LAYERS.forEach(l => {
    const p = lp(l.id);
    const nodes = [];
    l.scenes.forEach((sc, si) => {
      if (sc.qs) sc.qs.forEach((q, qi) => {
        const k = l.id + '#s' + si + '#q' + qi;
        if (p.wrong[k] !== undefined) nodes.push({ key: k, kind: 'quiz', stem: q.q, dh: q.dh, ok: !!p.wrong[k] });
      });
      if (sc.rounds) sc.rounds.forEach((r, ri) => {
        const k = l.id + '#s' + si + '#b' + ri;
        if (p.wrong[k] !== undefined) nodes.push({ key: k, kind: 'boss', stem: r.title, ok: !!p.wrong[k] });
      });
    });
    if (nodes.length) layers[l.id] = { name: l.name, who: l.who, unit: l.unit, week: l.week, fin: p.fin, scars: p.scars, ding: p.ding, ms: p.ms, nodes };
  });
  return { game: '名理之塔', exportedAt: new Date().toLocaleString('zh-CN'), bag: S.bag, layers, raw: S.log || [] };
}
function toCSV() {
  const rows = [['层', '层名', '关主', '节点', '题型', '题干/轮次', '首答是否通过']];
  LAYERS.forEach(l => {
    const p = lp(l.id);
    l.scenes.forEach((sc, si) => {
      if (sc.qs) sc.qs.forEach((q, qi) => {
        const k = l.id + '#s' + si + '#q' + qi;
        if (p.wrong[k] !== undefined) rows.push([l.id, l.name, l.who, k, '答题', (q.dh || '') + ' ' + String(q.q).slice(0, 40).replace(/"/g, "'"), p.wrong[k] ? '通过' : '未通过']);
      });
      if (sc.rounds) sc.rounds.forEach((r, ri) => {
        const k = l.id + '#s' + si + '#b' + ri;
        if (p.wrong[k] !== undefined) rows.push([l.id, l.name, l.who, k, '论辩', String(r.title).slice(0, 40).replace(/"/g, "'"), p.wrong[k] ? '通过' : '未通过']);
      });
    });
  });
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}
function toCSVRaw() {
  const rows = [['时间戳', '层', '节点', '题干', '是否通过', '耗时ms']];
  (S.log || []).forEach(r => rows.push([new Date(r.t).toLocaleString('zh-CN'), r.lid, r.key, r.title, r.ok ? '通过' : '未通过', r.ms]));
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}

/* ---------- 启动 ---------- */
load();
if (!location.hash) location.replace('#map');
route();

</script>
</body>
