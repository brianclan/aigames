<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C5CE7">
<title>语文闯关大冒险 · 一年级上册</title>
<style>
/* ===================== 基础 ===================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  background:#EDF1FA;color:#22314A;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#app{
  width:100%;max-width:460px;height:100%;max-height:940px;
  background:linear-gradient(170deg,#F7F9FF 0%,#EDF1FA 55%,#E8EEFB 100%);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 12px 60px rgba(70,90,160,.18);
}
@media(min-width:520px) and (min-height:800px){
  #app{border-radius:26px;}
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* ===================== 通用组件 ===================== */
.btn{
  border:none;border-radius:16px;font-family:inherit;font-weight:800;
  cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s;
  font-size:17px;padding:14px 22px;color:#fff;
  background:linear-gradient(180deg,#7C6BF0,#6350E0);
  box-shadow:0 4px 0 #4C3BC4,0 8px 18px rgba(99,80,224,.35);
  letter-spacing:.5px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4C3BC4,0 4px 10px rgba(99,80,224,.3);}
.btn.green{background:linear-gradient(180deg,#4ED08B,#2FB86E);box-shadow:0 4px 0 #21A05C,0 8px 18px rgba(47,184,110,.32);}
.btn.orange{background:linear-gradient(180deg,#FFB347,#FF9524);box-shadow:0 4px 0 #E07C10,0 8px 18px rgba(255,149,36,.32);}
.btn.red{background:linear-gradient(180deg,#FF7A7A,#F05252);box-shadow:0 4px 0 #CE3A3A,0 8px 18px rgba(240,82,82,.3);}
.btn.gray{background:linear-gradient(180deg,#B9C3D6,#9AA6BF);box-shadow:0 4px 0 #7E8AA3;}
.btn.sm{font-size:15px;padding:10px 18px;border-radius:13px;}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.85);border-radius:999px;
  padding:6px 13px;font-size:14px;font-weight:800;color:#3A4A68;
  box-shadow:0 2px 8px rgba(80,100,160,.13);
}
.card{
  background:#fff;border-radius:20px;padding:16px;
  box-shadow:0 4px 20px rgba(80,100,160,.13);
}

/* ===================== 首页 ===================== */
#home{padding:0;overflow-y:auto;}
.home-bg{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.bubble{position:absolute;border-radius:50%;opacity:.5;}
.hb1{width:190px;height:190px;background:radial-gradient(circle at 30% 30%,#C9D8FF,#EAF0FF);top:-60px;left:-50px;}
.hb2{width:150px;height:150px;background:radial-gradient(circle at 30% 30%,#FFE1C4,#FFF3E6);top:120px;right:-55px;}
.hb3{width:120px;height:120px;background:radial-gradient(circle at 30% 30%,#D3F5E4,#EDFBF4);bottom:210px;left:-40px;}
.hb4{width:170px;height:170px;background:radial-gradient(circle at 30% 30%,#EDDCFF,#F7F1FF);bottom:-50px;right:-45px;}
.home-inner{position:relative;z-index:1;padding:26px 20px 26px;display:flex;flex-direction:column;gap:15px;min-height:100%;}
.logo-emoji{font-size:54px;text-align:center;animation:float 3s ease-in-out infinite;line-height:1;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.title-main{
  text-align:center;font-size:29px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(95deg,#6C5CE7,#3FB8AF 55%,#FF9524);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.25;
}
.title-sub{text-align:center;font-size:13.5px;color:#6B7A99;font-weight:700;letter-spacing:.6px;margin-top:4px;}
.stat-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.timer-box{
  background:#fff;border-radius:22px;padding:14px 16px;
  box-shadow:0 4px 20px rgba(80,100,160,.14);
}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.timer-label{font-size:13.5px;font-weight:800;color:#6B7A99;}
.timer-val{font-size:15px;font-weight:900;color:#6C5CE7;font-variant-numeric:tabular-nums;}
.bar{height:12px;background:#EDF0F8;border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7C6BF0,#4ED08B);transition:width .4s;width:0;}
.avatar-row{display:flex;align-items:center;gap:12px;}
.avatar{
  width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#FFF0D6,#FFE0B0);
  display:flex;align-items:center;justify-content:center;font-size:31px;flex:0 0 auto;
  box-shadow:0 3px 12px rgba(200,150,60,.25);
}
.avatar-info{flex:1;min-width:0;}
.avatar-title{font-size:16px;font-weight:900;color:#2C3B57;display:flex;align-items:center;gap:5px;}
.avatar-desc{font-size:12px;color:#8391AB;font-weight:700;margin-top:3px;}

/* ===================== 地图页 ===================== */
#map{overflow:hidden;}
.topbar{
  flex:0 0 auto;padding:12px 14px 10px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(9px);
  border-bottom:1px solid rgba(140,160,210,.16);z-index:5;
}
.topbar .t-title{flex:1;font-size:16.5px;font-weight:900;color:#2C3B57;}
.icon-btn{
  width:37px;height:37px;border-radius:12px;border:none;background:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 9px rgba(80,100,160,.15);cursor:pointer;flex:0 0 auto;
}
.icon-btn:active{transform:scale(.94);}
.map-scroll{flex:1;overflow-y:auto;padding:16px 14px 90px;-webkit-overflow-scrolling:touch;}
.unit{
  background:#fff;border-radius:22px;padding:14px;margin-bottom:14px;
  box-shadow:0 4px 18px rgba(80,100,160,.11);position:relative;overflow:hidden;
}
.unit::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc,#6C5CE7);
}
.unit-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.unit-icon{
  width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:25px;flex:0 0 auto;background:var(--uct,#EDF0FB);
}
.unit-meta{flex:1;min-width:0;}
.unit-name{font-size:16px;font-weight:900;color:#2C3B57;}
.unit-prog{font-size:11.5px;color:#8895AE;font-weight:800;margin-top:3px;}
.unit-progbar{height:6px;background:#EDF0F8;border-radius:99px;overflow:hidden;margin-top:6px;}
.unit-progbar i{display:block;height:100%;background:var(--uc,#6C5CE7);border-radius:99px;transition:width .4s;width:0;}
.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.sub{
  display:flex;align-items:center;gap:8px;padding:11px 11px;
  border-radius:15px;background:#F6F8FE;border:2px solid transparent;
  cursor:pointer;transition:transform .12s,background .15s;
  position:relative;overflow:hidden;
}
.sub:active{transform:scale(.97);}
.sub .sn{
  width:25px;height:25px;border-radius:9px;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:900;color:#7C8BA6;box-shadow:0 1px 4px rgba(80,100,160,.14);
}
.sub .st{font-size:12.5px;font-weight:800;color:#3F4E6B;line-height:1.3;flex:1;min-width:0;}
.sub.done{background:#EAF9F1;}
.sub.done .sn{background:#2FB86E;color:#fff;}
.sub.locked{opacity:.5;}
.sub.locked .sn{background:#DFE4EF;color:#98A5BC;}
.sub .star-mini{font-size:10px;color:#FFB800;position:absolute;right:6px;top:5px;letter-spacing:-1px;}
.chest-row{
  display:flex;align-items:center;gap:11px;padding:12px 14px;margin-top:11px;
  border-radius:16px;background:linear-gradient(100deg,#FFF7E4,#FFEFD2);
  border:2px dashed #F0C97A;
}
.chest-row.ready{background:linear-gradient(100deg,#FFF0CE,#FFE2A6);border-color:#E8A93B;animation:pulseChest 1.6s infinite;}
@keyframes pulseChest{0%,100%{box-shadow:0 0 0 0 rgba(232,169,59,.4)}50%{box-shadow:0 0 0 9px rgba(232,169,59,0)}}
.chest-emoji{font-size:28px;}
.chest-txt{flex:1;font-size:12.5px;font-weight:800;color:#8A6218;line-height:1.4;}

/* ===================== 底部导航 ===================== */
.tabbar{
  flex:0 0 auto;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border-top:1px solid rgba(140,160,210,.16);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:6;
}
.tab{
  flex:1;border:none;background:none;padding:6px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;color:#9AA6BF;font-weight:800;font-size:10.5px;
}
.tab .ti{font-size:20px;line-height:1;}
.tab.on{color:#6C5CE7;}

/* ===================== 答题页 ===================== */
#play{background:#F4F7FD;}
.play-top{
  flex:0 0 auto;padding:11px 14px;display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(9px);
  border-bottom:1px solid rgba(140,160,210,.16);
}
.play-top .pt-title{flex:1;font-size:14.5px;font-weight:900;color:#2C3B57;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qbar{height:8px;background:#E6EAF5;border-radius:99px;overflow:hidden;margin:0 14px;}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#FFB347,#FF9524);border-radius:99px;transition:width .35s;width:0;}
.hud{display:flex;gap:7px;justify-content:center;padding:11px 14px 0;flex-wrap:wrap;}
.play-body{flex:1;overflow-y:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch;}
.qtext{
  font-size:19px;font-weight:900;color:#25344F;line-height:1.55;margin-bottom:16px;
  letter-spacing:.3px;
}
.qtext .hl{color:#6C5CE7;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:15px 15px;border-radius:17px;
  background:#fff;border:2.5px solid #E6EAF5;cursor:pointer;
  font-size:16.5px;font-weight:800;color:#2C3B57;line-height:1.42;text-align:left;
  font-family:inherit;transition:transform .12s,border-color .15s,background .15s;
  box-shadow:0 2px 9px rgba(80,100,160,.08);width:100%;
}
.opt:active{transform:scale(.98);}
.opt .badge{
  width:31px;height:31px;border-radius:11px;background:#F1F4FC;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:900;color:#7C8BA6;
}
.opt.right{background:#E9FBF1;border-color:#2FB86E;}
.opt.right .badge{background:#2FB86E;color:#fff;}
.opt.wrong{background:#FEEEEC;border-color:#F05252;animation:shake .4s;}
.opt.wrong .badge{background:#F05252;color:#fff;}
.opt.dim{opacity:.42;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.big{font-size:24px;justify-content:center;}

/* 拼音卡 */
.pinyin-card{
  background:#fff;border-radius:22px;padding:22px 16px;text-align:center;
  box-shadow:0 4px 20px rgba(80,100,160,.13);margin-bottom:16px;
}
.py-line{font-size:52px;font-weight:900;color:#6C5CE7;letter-spacing:3px;line-height:1.25;}
.py-line .py-sp{color:#3FB8AF;}
.py-hint{font-size:14px;color:#8895AE;font-weight:800;margin-top:9px;}

/* 大字卡 */
.bigchar{
  background:linear-gradient(150deg,#FFF9EE,#FFF3DE);border-radius:22px;
  padding:26px 16px;text-align:center;margin-bottom:16px;
  border:2.5px solid #F5E2BE;
}
.bigchar .bc-char{font-size:74px;font-weight:900;color:#B8791B;line-height:1.1;}
.bigchar .bc-py{font-size:19px;font-weight:800;color:#C9973F;margin-top:8px;letter-spacing:1px;}
.bigchar .bc-tip{font-size:12.5px;font-weight:700;color:#A98653;margin-top:8px;}

/* 田字格 */
.tian{
  width:150px;height:150px;margin:0 auto 14px;position:relative;
  background:#fff;border:3px solid #E4B96A;border-radius:12px;
}
.tian::before,.tian::after{content:'';position:absolute;background:repeating-linear-gradient(to right,#F0C97A 0 6px,transparent 6px 12px);}
.tian::before{left:0;right:0;top:50%;height:2px;transform:translateY(-1px);}
.tian::after{top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:repeating-linear-gradient(to bottom,#F0C97A 0 6px,transparent 6px 12px);}
.tian .ch{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:100px;font-weight:900;color:#2C3B57;line-height:1;
}

/* 排序题 */
.order-area{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.order-slot{
  min-height:56px;border-radius:16px;border:2.5px dashed #C9D3E8;background:#FAFBFF;
  display:flex;align-items:center;gap:7px;padding:8px 11px;flex-wrap:wrap;
}
.order-slot.filled{border-style:solid;border-color:#B9C3D6;}
.chip{
  padding:11px 15px;border-radius:14px;background:linear-gradient(180deg,#8B7BF5,#6C5CE7);
  color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;border:none;font-family:inherit;
  box-shadow:0 3px 0 #4C3BC4;transition:transform .12s;
}
.chip:active{transform:translateY(2px);}
.chip.sel{background:linear-gradient(180deg,#5FD9A6,#2FB86E);box-shadow:0 3px 0 #21A05C;}
.chip.pool{background:linear-gradient(180deg,#AEB9CE,#93A0B9);box-shadow:0 3px 0 #7A879F;}
.order-pool{display:flex;gap:9px;flex-wrap:wrap;padding:12px;border-radius:16px;background:#fff;min-height:64px;
  box-shadow:0 2px 10px rgba(80,100,160,.09);}

/* 分类题 */
.cats{display:flex;flex-direction:column;gap:11px;margin-bottom:13px;}
.cat{
  background:#fff;border-radius:17px;padding:12px;box-shadow:0 2px 11px rgba(80,100,160,.09);
  border:2.5px solid transparent;transition:border-color .15s,background .15s;
}
.cat.hot{border-color:#6C5CE7;background:#F5F3FF;}
.cat-title{font-size:13.5px;font-weight:900;color:#5A6A88;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.cat-title .dot{width:9px;height:9px;border-radius:50%;background:#6C5CE7;flex:0 0 auto;}
.cat-items{display:flex;gap:7px;flex-wrap:wrap;min-height:42px;align-content:flex-start;}
.pool-wrap{background:#F6F8FE;border-radius:17px;padding:12px;border:2px dashed #C9D3E8;}
.pool-title{font-size:12.5px;font-weight:900;color:#8895AE;margin-bottom:9px;}
.pool-items{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;}

/* 反馈浮层 */
.fb{
  position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  border-radius:20px;padding:15px 16px;z-index:30;
  box-shadow:0 -4px 30px rgba(60,80,140,.2);
  transform:translateY(160%);transition:transform .32s cubic-bezier(.2,1.1,.4,1);
}
.fb.show{transform:translateY(0);}
.fb.ok{background:linear-gradient(180deg,#EAFBF2,#DBF7E9);border:2.5px solid #7ED9A9;}
.fb.no{background:linear-gradient(180deg,#FFF0EE,#FFE2DF);border:2.5px solid #F5A9A2;}
.fb-head{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:8px;}
.fb.ok .fb-head{color:#1E9A5C;}
.fb.no .fb-head{color:#D63C3C;}
.fb-tip{font-size:14px;font-weight:700;color:#4A5A78;line-height:1.5;margin-bottom:12px;}
.fb-tip b{color:#2C3B57;}
.fb-row{display:flex;gap:9px;}

/* 结算页 */
#result{background:linear-gradient(170deg,#FFF8EA,#EFF3FC);}
.res-inner{flex:1;overflow-y:auto;padding:22px 18px 20px;text-align:center;}
.res-star{font-size:60px;line-height:1;animation:pop .55s cubic-bezier(.2,1.6,.5,1);}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.res-title{font-size:25px;font-weight:900;margin-top:10px;color:#2C3B57;}
.res-sub{font-size:14px;color:#7C8BA6;font-weight:800;margin-top:6px;}
.res-card{background:#fff;border-radius:20px;padding:15px;margin-top:16px;box-shadow:0 4px 18px rgba(80,100,160,.12);}
.res-line{display:flex;justify-content:space-between;font-size:14.5px;font-weight:800;color:#4A5A78;padding:7px 2px;}
.res-line b{color:#6C5CE7;font-size:16px;}
.res-line.err b{color:#F05252;}
.wrong-list{margin-top:14px;text-align:left;}
.wrong-item{
  background:#FFF7F6;border-left:4px solid #F5A9A2;border-radius:11px;
  padding:11px 12px;margin-bottom:9px;
}
.wrong-item .wq{font-size:13.5px;font-weight:900;color:#3F4E6B;line-height:1.45;}
.wrong-item .wa{font-size:12.5px;font-weight:700;color:#D63C3C;margin-top:5px;line-height:1.45;}

/* ===================== 弹窗 ===================== */
.modal{
  position:absolute;inset:0;background:rgba(30,42,70,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:60;
}
.modal.show{display:flex;}
.modal-box{
  background:#fff;border-radius:24px;padding:22px 18px;width:100%;max-height:82%;overflow-y:auto;
  box-shadow:0 16px 50px rgba(30,42,70,.3);animation:pop .35s cubic-bezier(.2,1.4,.5,1);
}
.modal-title{font-size:19px;font-weight:900;text-align:center;color:#2C3B57;margin-bottom:14px;}
.modal-actions{display:flex;gap:9px;margin-top:16px;}
.modal-actions .btn{flex:1;}

/* 知识卡 */
.kc-lessons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;}
.kc-lesson{
  font-size:11.5px;font-weight:800;color:#6C5CE7;background:#F1EEFF;
  border-radius:9px;padding:5px 9px;
}
.kc-point{
  font-size:13.5px;font-weight:700;color:#3F4E6B;line-height:1.62;
  padding:10px 12px;background:#F7F9FE;border-radius:13px;margin-bottom:8px;
  border-left:4px solid #A99BF5;
}
.kc-poem{
  background:linear-gradient(150deg,#FFF9EE,#FFF3DE);border-radius:15px;padding:13px 14px;margin-bottom:9px;
  border:2px solid #F5E2BE;
}
.kc-poem .kp-t{font-size:15px;font-weight:900;color:#B8791B;}
.kc-poem .kp-a{font-size:11.5px;font-weight:800;color:#C9973F;margin:3px 0 7px;}
.kc-poem .kp-c{font-size:14px;font-weight:700;color:#7A5A22;line-height:1.7;}

/* 勋章墙 */
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:6px;}
.badge-it{
  background:#F7F9FE;border-radius:16px;padding:12px 6px;text-align:center;
}
.badge-it.on{background:linear-gradient(160deg,#FFF4DC,#FFE9BE);box-shadow:0 2px 10px rgba(220,170,60,.2);}
.badge-it .bi-e{font-size:27px;line-height:1;filter:grayscale(1);opacity:.35;}
.badge-it.on .bi-e{filter:none;opacity:1;}
.badge-it .bi-n{font-size:10.5px;font-weight:900;color:#8895AE;margin-top:6px;line-height:1.25;}
.badge-it.on .bi-n{color:#8A6218;}

/* 宝箱动画 */
.chest-modal{background:rgba(30,42,70,.62);}
.chest-open{text-align:center;padding:8px 0 4px;}
.chest-big{font-size:82px;display:inline-block;animation:chestShake .55s ease-in-out infinite;}
@keyframes chestShake{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.09)}}
.chest-reward{
  margin-top:16px;background:linear-gradient(160deg,#FFF6E0,#FFEABC);
  border-radius:18px;padding:17px;border:2.5px solid #F0C97A;
}
.chest-reward .cr-e{font-size:46px;line-height:1;}
.chest-reward .cr-n{font-size:18px;font-weight:900;color:#8A6218;margin-top:8px;}
.chest-reward .cr-d{font-size:12.5px;font-weight:700;color:#A98653;margin-top:6px;line-height:1.5;}

/* 时间到 */
.timeup-emoji{font-size:66px;text-align:center;line-height:1;}
.timeup-title{font-size:21px;font-weight:900;text-align:center;color:#2C3B57;margin-top:12px;}
.timeup-desc{font-size:14px;font-weight:700;color:#7C8BA6;text-align:center;line-height:1.62;margin-top:11px;}

/* 飞星 */
.fly{
  position:absolute;font-size:28px;pointer-events:none;z-index:80;
  animation:flyUp 1s ease-out forwards;
}
@keyframes flyUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(1.7)}}
/* 彩带 */
.confetti{position:absolute;width:9px;height:15px;pointer-events:none;z-index:75;border-radius:2px;}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.15}}
/* 提示条 */
.toast{
  position:absolute;left:50%;top:calc(50% - 130px);transform:translate(-50%,-50%) scale(.85);
  background:rgba(35,48,76,.94);color:#fff;font-size:15.5px;font-weight:800;
  padding:13px 22px;border-radius:16px;z-index:90;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;text-align:center;max-width:88%;line-height:1.45;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
::-webkit-scrollbar{width:0;height:0;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <div class="screen active" id="home">
    <div class="home-bg">
      <div class="bubble hb1"></div><div class="bubble hb2"></div>
      <div class="bubble hb3"></div><div class="bubble hb4"></div>
    </div>
    <div class="home-inner">
      <div class="logo-emoji" id="homeAvatar">🐣</div>
      <div>
        <div class="title-main">语文闯关大冒险</div>
        <div class="title-sub">一年级上册 · 统编版（2024）</div>
      </div>

      <div class="timer-box">
        <div class="timer-top">
          <div class="timer-label">⏱️ 今日学习时间</div>
          <div class="timer-val" id="todayTimer">0 / 20 分钟</div>
        </div>
        <div class="bar"><i class="bar-fill" id="todayBar"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;font-weight:800;color:#8895AE;">
          <span id="todayStars">今日 ⭐ 0</span>
          <span id="streakTxt">🔥 连续 0 天</span>
        </div>
      </div>

      <div class="card">
        <div class="avatar-row">
          <div class="avatar" id="avatarBox">🐣</div>
          <div class="avatar-info">
            <div class="avatar-title" id="titleName">🌱 语文小新芽</div>
            <div class="avatar-desc" id="titleDesc">再获得 15 颗星星升级！</div>
          </div>
        </div>
        <div style="display:flex;gap:7px;margin-top:13px;justify-content:center;flex-wrap:wrap;">
          <span class="pill">⭐ <b id="pStars">0</b></span>
          <span class="pill">🪙 <b id="pCoins">0</b></span>
          <span class="pill">🎖️ <b id="pBadges">0</b></span>
          <span class="pill">📦 <b id="pChests">0</b></span>
        </div>
      </div>

      <button class="btn" style="font-size:19px;padding:17px;" onclick="startAdventure()">🚀 开始闯关</button>

      <div style="display:flex;gap:9px;">
        <button class="btn sm gray" style="flex:1" onclick="openWall()">🎖️ 勋章墙</button>
        <button class="btn sm gray" style="flex:1" onclick="openWrongBook()">📕 错题本</button>
        <button class="btn sm gray" style="flex:1" onclick="openSettings()">⚙️ 设置</button>
      </div>

      <div style="text-align:center;font-size:11.5px;color:#98A5BC;font-weight:700;line-height:1.6;padding:0 8px;">
        每天坚持 20 分钟，8 大关卡 40+ 小关等你挑战！<br>
        学完一个单元就回来复习一次，记得更牢哦～
      </div>
    </div>
  </div>

  <!-- ============ 闯关地图 ============ -->
  <div class="screen" id="map">
    <div class="topbar">
      <button class="icon-btn" onclick="show('home')">🏠</button>
      <div class="t-title">选择关卡</div>
      <span class="pill" style="padding:5px 10px;font-size:12.5px;">⭐ <b id="mStars">0</b></span>
      <span class="pill" style="padding:5px 10px;font-size:12.5px;">🪙 <b id="mCoins">0</b></span>
    </div>
    <div class="map-scroll" id="mapScroll"></div>
  </div>

  <!-- ============ 答题页 ============ -->
  <div class="screen" id="play">
    <div class="play-top">
      <button class="icon-btn" onclick="quitPlay()">✕</button>
      <div class="pt-title" id="playTitle">关卡</div>
      <span class="pill" style="padding:5px 9px;font-size:12.5px;">❤️ <b id="hpHud">3</b></span>
    </div>
    <div class="qbar" style="margin-top:10px;"><i id="qbarFill"></i></div>
    <div class="hud">
      <span class="pill" style="padding:5px 10px;font-size:12px;">第 <b id="qIdx">1</b>/<b id="qTotal">10</b> 题</span>
      <span class="pill" style="padding:5px 10px;font-size:12px;">⚡ <b id="comboHud">0</b> 连对</span>
      <span class="pill" style="padding:5px 10px;font-size:12px;">⭐ <b id="starHud">0</b></span>
    </div>
    <div class="play-body" id="playBody"></div>
    <div class="fb" id="fb">
      <div class="fb-head" id="fbHead"></div>
      <div class="fb-tip" id="fbTip"></div>
      <div class="fb-row"><button class="btn green" style="flex:1" id="fbBtn" onclick="nextQuestion()">继续</button></div>
    </div>
  </div>

  <!-- ============ 结算页 ============ -->
  <div class="screen" id="result">
    <div class="res-inner" id="resInner"></div>
  </div>

  <!-- ============ 通用弹窗 ============ -->
  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="questions.js"></script>
<script src="main.js"></script>
</body>
</html>
